<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Segona Part Professional · Agents PL · 44 preg.</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif; background: #e9edf2; padding: 16px 12px 40px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; color: #1e293b; }
        .container { max-width: 680px; width: 100%; background: #fff; border-radius: 32px; box-shadow: 0 12px 40px rgba(0,0,0,0.08); padding: 24px 20px 30px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eef2f6; padding-bottom: 14px; margin-bottom: 22px; }
        .header h1 { font-size: 22px; font-weight: 700; color: #0b2b4a; }
        .header h1 small { font-size: 14px; font-weight: 400; color: #64748b; margin-left: 8px; }
        .progress-badge { background: #dbe7f3; color: #0b2b4a; font-weight: 600; padding: 6px 16px; border-radius: 30px; font-size: 15px; white-space: nowrap; }
        .question-number { font-weight: 700; color: #1a4b7a; font-size: 15px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
        .question-text { font-size: 20px; font-weight: 600; line-height: 1.4; margin-bottom: 24px; min-height: 3.2em; color: #0a1e32; }
        .options { display: flex; flex-direction: column; gap: 12px; margin-bottom: 28px; }
        .option { background: #f8fafc; border: 2px solid #dce2ea; border-radius: 16px; padding: 16px 20px; font-size: 17px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 14px; touch-action: manipulation; user-select: none; -webkit-user-select: none; transition: 0.15s; }
        .option:active { transform: scale(0.98); }
        .option .letter { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 50%; background: #dce2ea; color: #1e293b; font-weight: 700; font-size: 16px; flex-shrink: 0; }
        .option.selected { border-color: #1a4b7a; background: #e6eff9; }
        .option.selected .letter { background: #1a4b7a; color: white; }
        .option.correct { border-color: #1e7e34; background: #e6f5ea; }
        .option.correct .letter { background: #1e7e34; color: white; }
        .option.wrong { border-color: #b91c1c; background: #fde8e8; }
        .option.wrong .letter { background: #b91c1c; color: white; }
        .option.disabled { pointer-events: none; opacity: 0.9; }
        .option.disabled:active { transform: none; }
        .feedback { background: #f1f5f9; border-radius: 18px; padding: 18px 20px; margin: 4px 0 24px; display: none; border-left: 6px solid #94a3b8; }
        .feedback.show { display: block; }
        .feedback .badge { display: inline-block; font-weight: 700; font-size: 15px; padding: 4px 18px; border-radius: 30px; margin-bottom: 10px; }
        .badge.correct-badge { background: #d1f0d9; color: #0f5424; }
        .badge.wrong-badge { background: #fcd5d5; color: #8b1a1a; }
        .feedback .justification { font-size: 16px; line-height: 1.5; margin: 8px 0; }
        .feedback .mnemonic { background: #fef7e0; border-radius: 14px; padding: 12px 16px; margin-top: 14px; font-size: 15px; border: 1px solid #f7d97a; color: #7a5800; }
        .feedback .mnemonic strong { font-weight: 700; color: #5f4300; }
        .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 4px; }
        .btn { flex: 1; min-width: 100px; background: #eef2f6; border: none; border-radius: 40px; padding: 14px 18px; font-weight: 600; font-size: 17px; color: #1e293b; cursor: pointer; transition: 0.15s; text-align: center; touch-action: manipulation; }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background: #1a4b7a; color: white; box-shadow: 0 4px 12px rgba(26,75,122,0.25); }
        .btn-primary:disabled { opacity: 0.5; pointer-events: none; box-shadow: none; }
        .btn-secondary { background: #e2e8f0; }
        .btn-success { background: #1e7e34; color: white; box-shadow: 0 4px 12px rgba(30,126,52,0.25); }
        .btn-warning { background: #d97706; color: white; box-shadow: 0 4px 12px rgba(217,119,6,0.25); }
        .result-box { text-align: center; padding: 20px 0 10px; }
        .result-box .score { font-size: 60px; font-weight: 800; color: #0b2b4a; }
        .result-box .label { font-size: 20px; color: #475569; margin-top: 4px; }
        .result-box .message { margin-top: 16px; font-size: 18px; font-weight: 500; }
        .result-detail { margin-top: 20px; text-align: left; max-height: 400px; overflow-y: auto; border-top: 1px solid #e2e8f0; padding-top: 16px; }
        .result-item { padding: 10px 0; border-bottom: 1px solid #e9edf2; font-size: 14px; }
        .result-item .justif { font-size: 13px; background: #f1f5f9; padding: 4px 10px; border-radius: 8px; margin-top: 4px; display: inline-block; }
        .result-item .mnemo { font-size: 13px; background: #fef7e0; padding: 4px 10px; border-radius: 8px; margin-top: 4px; display: inline-block; border: 1px solid #f7d97a; }
        .hidden { display: none !important; }
        @media (max-width: 480px) { .container { padding: 18px 14px 22px; } .question-text { font-size: 18px; } .option { font-size: 15px; padding: 14px 16px; } .btn { font-size: 15px; padding: 12px 10px; min-width: 80px; } .header h1 { font-size: 19px; } }
    </style>
</head>
<body>
<div class="container" id="app">
    <div class="header">
        <h1>👮 Segona Part Professional <small>44 preguntes</small></h1>
        <span class="progress-badge" id="progressLabel">1 / 44</span>
    </div>
    <div id="questionArea">
        <div class="question-number"><span id="qNumber">Pregunta 1</span><span id="questionStatus"></span></div>
        <div class="question-text" id="qText">Carregant...</div>
        <div class="options" id="optionsContainer"></div>
        <div class="feedback" id="feedback">
            <div><span class="badge" id="badgeResult">✅ Correcte</span></div>
            <div class="justification" id="justificationText"></div>
            <div class="mnemonic" id="mnemonicText"><strong>🧠 Truc:</strong> </div>
        </div>
        <div class="actions">
            <button class="btn btn-secondary" id="prevBtn" disabled>← Anterior</button>
            <button class="btn btn-primary" id="checkBtn">Comprovar</button>
            <button class="btn btn-primary" id="nextBtn" style="display:none;">Següent →</button>
        </div>
    </div>
    <div id="resultArea" class="result-box hidden">
        <div class="score" id="finalScore">0</div>
        <div class="label">encerts de 44</div>
        <div class="message" id="finalMessage">😊 Bon treball!</div>
        <div style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:16px;">
            <button class="btn btn-success" id="resetBtn">🔄 Tornar a començar</button>
            <button class="btn btn-warning" id="retryWrongBtn" style="display:none;">📝 Repetir fallades</button>
        </div>
        <div class="result-detail" id="resultDetail"></div>
    </div>
</div>
<script>
// PREGUNTES EXTRETES DEL CORRECTOR OFICIAL - SEGONA PART PROFESSIONAL - MARTORELL 2025
const PREGUNTES = [
{id:1, pregunta:"Amb quin d'aquests municipis NO limita Martorell?", opcions:["Castellví de Rosanes","Abrera","Olesa de Montserrat"], correcta:2, justificacio:"Martorell limita amb Castellví de Rosanes i Abrera, però no amb Olesa de Montserrat.", mnemo:"Olesa → no limita, com 'O'."},
{id:2, pregunta:"A Martorell on s'ofereix el servei d'atenció a les dones?", opcions:["SIAD","SAD","CAD"], correcta:0, justificacio:"El SIAD (Servei d'Informació i Atenció a les Dones) és el servei municipal d'atenció a les dones.", mnemo:"SIAD → dones, com 'S'."},
{id:3, pregunta:"La minuta policial:", opcions:["És una diligència, forma part del cos de l'atestat","És un acta, forma part de l'annex de l'atestat","És un document intern de la policia, no forma part de l'atestat"], correcta:2, justificacio:"La minuta és un document intern de la policia que no forma part de l'atestat.", mnemo:"Minuta → interna, com 'M'."},
{id:4, pregunta:"Qui té la responsabilitat de declarar una emergència municipal en fase d'alerta?", opcions:["El conseller d'Interior","L'alcalde/essa del municipi","El cap de la Policia Local"], correcta:1, justificacio:"L'alcalde és el responsable de declarar l'emergència municipal en fase d'alerta.", mnemo:"Alcalde → emergència, com 'A'."},
{id:5, pregunta:"La protecció civil municipal es fonamenta en:", opcions:["Plans autonòmics únicament","Plans municipals i coordinació amb altres administracions","No existeix competència municipal"], correcta:1, justificacio:"La protecció civil municipal es basa en plans municipals i coordinació amb altres administracions.", mnemo:"Protecció civil → plans municipals, com 'P'."},
{id:6, pregunta:"Davant la comissió d'un delicte lleu és procedent la detenció?", opcions:["No, mai","Sí, quan el presumpte autor no tingui documentació","Sí, sempre que no acrediti identitat i/o no doni fiança"], correcta:2, justificacio:"La detenció per delicte lleu és procedent si no s'acredita identitat o no es dona fiança (art. 495 LECrim).", mnemo:"Delicte lleu → detenció amb condicions, com 'C'."},
{id:7, pregunta:"Quan la policia assistencial atén una víctima de violència de gènere, quina ha de ser la seva prioritat?", opcions:["Formalitzar primer la denúncia","Garantir la seguretat immediata i activar protocols","Traslladar-la a l'hospital sense més actuacions"], correcta:1, justificacio:"La prioritat és garantir la seguretat immediata de la víctima i activar els protocols corresponents.", mnemo:"Violència de gènere → seguretat, com 'S'."},
{id:8, pregunta:"Qui regula el temari i proves de selecció?", opcions:["Ajuntament convocant","Generalitat","Estat"], correcta:0, justificacio:"L'Ajuntament convocant regula el temari i les proves de selecció.", mnemo:"Temari → Ajuntament, com 'A'."},
{id:9, pregunta:"Qui presideix la Junta local de seguretat?", opcions:["El cap de la policia local","L'alcalde/l'alcaldessa","El regidor de seguretat ciutadana"], correcta:1, justificacio:"L'alcalde presideix la Junta Local de Seguretat (Llei 4/2003).", mnemo:"JLS → alcalde, com 'A'."},
{id:10, pregunta:"La Comissió de Policia de Catalunya és l'òrgan consultiu col·legiat superior en matèria de:", opcions:["Coordinació entre Mossos i Policies Locals","Consultes sobre actuacions de Mossos","Coordinació de totes les forces de seguretat a Catalunya"], correcta:0, justificacio:"La Comissió de Policia de Catalunya coordina Mossos d'Esquadra i Policies Locals (Llei 4/2003).", mnemo:"Comissió → coordinació, com 'C'."},
{id:11, pregunta:"Quan la policia assistencial intervé amb menors en situació de risc, què és essencial?", opcions:["Traslladar-los a un centre educatiu","Coordinar-se amb serveis socials i garantir la protecció","Informar només als tutors legals"], correcta:1, justificacio:"És essencial coordinar-se amb serveis socials i garantir la protecció del menor.", mnemo:"Menors → serveis socials, com 'S'."},
{id:12, pregunta:"Quin d'aquests drets no és aplicable a les persones detingudes?", opcions:["Dret a realitzar una trucada","Dret a ser visitat per la persona que designi","Tots són drets inherents"], correcta:2, justificacio:"Tots els drets esmentats són aplicables a les persones detingudes.", mnemo:"Drets detinguts → tots, com 'T'."},
{id:13, pregunta:"Les armes de foc de servei s'han de:", opcions:["Portar sempre fora del servei","Retornar a l'armer municipal fora de servei","Custodiar al domicili del policia"], correcta:1, justificacio:"Les armes s'han de retornar a l'armer municipal fora de servei (Decret 219/1996).", mnemo:"Arma → armer municipal, com 'A'."},
{id:14, pregunta:"Segons la LO 4/2000, quina autoritat és competent per autoritzar la residència temporal d'estrangers?", opcions:["L'Ajuntament","La Delegació/Subdelegació del Govern","El Consell Comarcal"], correcta:1, justificacio:"La Delegació o Subdelegació del Govern autoritza la residència temporal d'estrangers.", mnemo:"Residència → Delegació, com 'D'."},
{id:15, pregunta:"D'acord amb l'art. 3 de la Llei 16/1991, hi pot haver policia local:", opcions:["Municipis de més de 20.000 habitants","Municipis de més de 5.000 habitants","Municipis de més de 10.000 habitants"], correcta:0, justificacio:"L'art. 3 de la Llei 16/1991 estableix policia local en municipis de més de 20.000 habitants.", mnemo:"20.000 → policia local, com '20'."},
{id:16, pregunta:"Segons l'art. 16 de la LO 4/2015, en quins supòsits els agents poden requerir la identificació?", opcions:["En qualsevol moment","Quan hi hagi indicis d'haver comès una infracció","Només si estaven cometent un delicte"], correcta:1, justificacio:"La identificació es pot requerir quan hi hagi indicis de participació en una infracció (art. 16 LO 4/2015).", mnemo:"Identificació → indicis, com 'I'."},
{id:17, pregunta:"Quant de temps pot durar una detenció?", opcions:["El temps mínim imprescindible","72 hores","24h per a menors i 72 per a majors"], correcta:0, justificacio:"La detenció ha de durar el temps mínim imprescindible per esclarir els fets (art. 17 CE i 520 LECrim).", mnemo:"Detenció → mínim imprescindible, com 'M'."},
{id:18, pregunta:"Segons la LO 4/2000, quin és el dret d'un estranger en situació irregular davant una detenció administrativa?", opcions:["No té dret a assistència","Ser informat dels seus drets i tenir accés a recurs","Pot sol·licitar residència"], correcta:1, justificacio:"L'estranger té dret a ser informat dels seus drets i a interposar recurs.", mnemo:"Estranger → drets i recurs, com 'D'."},
{id:19, pregunta:"Quin supòsit permet a la Policia Local realitzar una entrada a domicili sense ordre judicial ni consentiment?", opcions:["Sospita raonable de delicte greu","Perill imminent per a la vida o integritat","Observació indirecta de consum de substàncies"], correcta:1, justificacio:"L'entrada sense consentiment ni ordre és possible en cas de perill imminent per a persones (art. 18 CE).", mnemo:"Entrada domicili → perill imminent, com 'P'."},
{id:20, pregunta:"La detenció de les persones menors d'edat té unes característiques concretes:", opcions:["Notificació a representants legals i MF, màxim 24h","Notificació a representants legals i jutjat, màxim 24h","Només difereix en el temps màxim"], correcta:0, justificacio:"La detenció de menors es notifica als representants legals i al Ministeri Fiscal, amb un màxim de 24h (LO 5/2000).", mnemo:"Menor → 24h, com '24'."},
{id:21, pregunta:"Quina conducta pot ser constitutiva de delicte contra els recursos naturals i el medi ambient?", opcions:["Abocaments contaminants en un riu","Circular amb vehicle en espai protegit","Caçar en zona de veda"], correcta:0, justificacio:"Els abocaments contaminants que danyin l'equilibri natural són delicte (art. 325 CP).", mnemo:"Medi ambient → abocaments, com 'A'."},
{id:22, pregunta:"Quina és correcta sobre la presència de testimonis durant un registre domiciliari?", opcions:["És opcional","És obligatòria si el titular ho sol·licita","No és necessària si l'ordre judicial no ho especifica"], correcta:1, justificacio:"La presència de testimonis en un registre domiciliari és obligatòria si el titular ho sol·licita (art. 569 LECrim).", mnemo:"Testimonis → si ho sol·licita, com 'T'."},
{id:23, pregunta:"Quina és la responsabilitat de la Policia Local si es realitza un registre sense complir els requisits legals?", opcions:["No hi ha responsabilitat","Responsabilitat administrativa","Responsabilitat penal per vulneració de drets fonamentals"], correcta:2, justificacio:"El registre sense requisits legals vulnera drets fonamentals i pot generar responsabilitat penal.", mnemo:"Registre il·legal → penal, com 'P'."},
{id:24, pregunta:"A quina velocitat màxima es pot circular en una via sense pavimentar?", opcions:["50 km/h","30 km/h","Dependrà de l'ample de la via"], correcta:1, justificacio:"La velocitat màxima en vies sense pavimentar és de 30 km/h (RGC).", mnemo:"Sense pavimentar → 30 km/h, com '30'."},
{id:25, pregunta:"Un exemple d'infracció lleu segons la Llei 11/2009 és:", opcions:["Superar l'aforament màxim en un 5%","Permetre l'accés de menors a locals prohibits","Realitzar l'activitat sense llicència"], correcta:0, justificacio:"Superar l'aforament en un 5% és infracció lleu (Llei 11/2009).", mnemo:"5% → lleu, com '5'."},
{id:26, pregunta:"Segons la Llei 11/2009, qui té la competència per establir les condicions de seguretat en un espectacle públic?", opcions:["El Ministeri de l'Interior","La Generalitat de Catalunya","L'Ajuntament corresponent"], correcta:2, justificacio:"L'Ajuntament corresponent estableix les condicions de seguretat en espectacles públics (Llei 11/2009).", mnemo:"Espectacle → Ajuntament, com 'A'."},
{id:27, pregunta:"Quin procediment ha de seguir la Policia Local en cas d'incompliment d'una ordenança municipal en activitats recreatives?", opcions:["Procediment penal directe","Procediment administratiu sancionador","Procediment civil"], correcta:1, justificacio:"L'incompliment d'ordenances s'ha de tramitar per procediment administratiu sancionador.", mnemo:"Ordenança → administratiu, com 'A'."},
{id:28, pregunta:"Segons la Llei 4/1997, què ha de garantir la Policia Local en un pla d'emergència?", opcions:["La seguretat vial","L'aplicació correcta de mesures operatives i protecció de la població","La coordinació amb serveis sanitaris"], correcta:1, justificacio:"La Policia Local ha de garantir mesures operatives i protecció de la població (Llei 4/1997).", mnemo:"Emergència → protecció població, com 'P'."},
{id:29, pregunta:"Quina és una falta molt greu segons la Llei 16/1991?", opcions:["Retard injustificat","Abandonament del servei","Incorrecció amb companys"], correcta:1, justificacio:"L'abandonament del servei és una falta molt greu (Llei 16/1991).", mnemo:"Abandonament → molt greu, com 'A'."},
{id:30, pregunta:"La velocitat genèrica de la via podrà augmentar-se en:", opcions:["20 km/h en vies fins a 100 km/h","20 km/h en vies fins a 120 km/h","No es pot superar el límit genèric"], correcta:0, justificacio:"La velocitat genèrica es pot augmentar en 20 km/h en vies amb límit de 100 km/h (RGC).", mnemo:"+20 km/h → 100 km/h, com '20'."},
{id:31, pregunta:"Els estrangers poden participar en processos electorals espanyols?", opcions:["No, mai","Sí, sempre","Sí, en eleccions municipals exclusivament"], correcta:2, justificacio:"Els estrangers poden votar en eleccions municipals si compleixen els requisits (tractats i LO 5/1985).", mnemo:"Estrangers → municipals, com 'M'."},
{id:32, pregunta:"L'Estatut d'Autonomia de Catalunya és:", opcions:["Una llei ordinària","Una norma institucional bàsica de l'Estat","Una norma institucional bàsica de Catalunya"], correcta:2, justificacio:"L'Estatut és la norma institucional bàsica de Catalunya (art. 1 EAC).", mnemo:"Estatut → norma bàsica de Catalunya, com 'C'."},
{id:33, pregunta:"Què és un ban?", opcions:["Un acte administratiu solemne de l'alcalde","Un acte administratiu de qualsevol regidor","Decret i ban són equivalents"], correcta:0, justificacio:"El ban és un acte administratiu solemne emès per l'alcalde.", mnemo:"Ban → alcalde, com 'B'."},
{id:34, pregunta:"Qui és el responsable de la infracció en cas d'un vehicle de dues rodes en el que el passatger no utilitza el casc?", opcions:["El passatger","El conductor","El titular del vehicle"], correcta:1, justificacio:"El conductor és responsable de l'infracció per no vetllar per l'ús del casc del passatger (RGC).", mnemo:"Casc → conductor, com 'C'."},
{id:35, pregunta:"Davant la necessitat de retirar un vehicle en via urbana, quina normativa empara aquesta actuació?", opcions:["Llei de Seguretat Viària","Reglament General de Circulació","Ordenança Municipal de Circulació"], correcta:2, justificacio:"La retirada de vehicles en via urbana es regeix per l'Ordenança Municipal de Circulació.", mnemo:"Retirada → Ordenança Municipal, com 'O'."},
{id:36, pregunta:"Quin paper tenen els ajuntaments en prevenció de la delinqüència?", opcions:["Crear ordenances de convivència ciutadana","Prevenció mitjançant serveis socials i policia de proximitat","Cap resposta és correcte"], correcta:1, justificacio:"Els ajuntaments prevenen la delinqüència mitjançant serveis socials i policia de proximitat.", mnemo:"Prevenció → serveis socials i proximitat, com 'S'."},
{id:37, pregunta:"Un furt superior a 400€ es considera:", opcions:["Delicte lleu","Delicte menys greu","Delicte de robatori"], correcta:0, justificacio:"El furt per valor superior a 400€ és delicte lleu (art. 234 CP).", mnemo:"Furt >400€ → lleu, com 'L'."},
{id:38, pregunta:"Qui té obligació legal de denunciar sospites de maltractament familiar?", opcions:["Només la víctima","Professionals com sanitaris, educadors o Policia Local","Només familiars"], correcta:1, justificacio:"Professionals (sanitaris, educadors, policia) tenen obligació de denunciar sospites (art. 262 LECrim).", mnemo:"Maltractament → professionals, com 'P'."},
{id:39, pregunta:"La LO 10/2022 reforça la protecció integral de la víctima en quins supòsits?", opcions:["Només en agressions físiques","En qualsevol agressió o coacció sexual, física o psicològica","Només en conflictes de parella"], correcta:1, justificacio:"La LO 10/2022 protegeix en qualsevol agressió sexual, física o psicològica.", mnemo:"LO 10/2022 → agressió sexual, física, psicològica, com 'SFP'."},
{id:40, pregunta:"El municipi exerceix com a competències pròpies, en les matèries següents:", opcions:["Policia Local, protecció civil i extinció d'incendis, només amb delegació expressa","Policia Local, protecció civil, extinció d'incendis, trànsit, estacionament, mobilitat i transport col·lectiu urbà","Només s'exerceixen en municipis de més de 20.000 habitants"], correcta:1, justificacio:"El municipi té competències pròpies en Policia Local, protecció civil, extinció d'incendis, trànsit, estacionament, mobilitat i transport col·lectiu (LBRL i Llei 16/1991).", mnemo:"Competències pròpies → totes, com 'T'."},

let answers=new Array(PREGUNTES.length).fill(null), revealed=new Array(PREGUNTES.length).fill(false), currentIndex=0, mode='normal', wrongIndices=[];
const $=id=>document.getElementById(id), questionArea=$('questionArea'), resultArea=$('resultArea'), progressLabel=$('progressLabel'), qNumber=$('qNumber'), questionStatus=$('questionStatus'), qText=$('qText'), optionsContainer=$('optionsContainer'), feedback=$('feedback'), badgeResult=$('badgeResult'), justificationText=$('justificationText'), mnemonicText=$('mnemonicText'), checkBtn=$('checkBtn'), nextBtn=$('nextBtn'), prevBtn=$('prevBtn'), resetBtn=$('resetBtn'), retryWrongBtn=$('retryWrongBtn'), finalScore=$('finalScore'), finalMessage=$('finalMessage'), resultDetail=$('resultDetail');
function getCurrentQuestions(){if(mode==='retry'&&wrongIndices.length>0)return wrongIndices.map(i=>PREGUNTES[i]);return PREGUNTES;}
function getCurrentAnswers(){if(mode==='retry'&&wrongIndices.length>0)return wrongIndices.map(i=>answers[i]);return answers;}
function getCurrentRevealed(){if(mode==='retry'&&wrongIndices.length>0)return wrongIndices.map(i=>revealed[i]);return revealed;}
function renderQuestion(index){const qs=getCurrentQuestions(), ans=getCurrentAnswers(), rev=getCurrentRevealed();if(index>=qs.length){showResults();return;}const q=qs[index], userAnswer=ans[index], isRevealed=rev[index], total=qs.length;progressLabel.textContent=index+1+' / '+total;qNumber.innerHTML='<span>Pregunta '+(index+1)+'</span><span id="questionStatus"></span>';if(isRevealed){const isCorrect=userAnswer===q.correcta;document.getElementById('questionStatus').textContent=isCorrect?'✅':'❌';}else{document.getElementById('questionStatus').textContent='';}qText.textContent=q.pregunta;optionsContainer.innerHTML='';const letters=['a','b','c'];q.opcions.forEach((text,i)=>{const div=document.createElement('div');div.className='option';if(userAnswer===i)div.classList.add('selected');if(isRevealed){div.classList.add('disabled');if(i===q.correcta)div.classList.add('correct');if(userAnswer===i&&i!==q.correcta)div.classList.add('wrong');}div.innerHTML='<span class="letter">'+letters[i]+'</span> '+text;div.dataset.index=i;if(!isRevealed){const handler=()=>selectOption(index,i);div.addEventListener('click',handler);div.addEventListener('touchstart',(e)=>{if(!e.target.closest('.option.disabled'))handler();},{passive:true});}optionsContainer.appendChild(div);});if(isRevealed){const isCorrect=userAnswer===q.correcta;badgeResult.textContent=isCorrect?'✅ Correcte':'❌ Incorrecte';badgeResult.className='badge '+(isCorrect?'correct-badge':'wrong-badge');justificationText.textContent=q.justificacio;mnemonicText.innerHTML='<strong>🧠 Truc:</strong> '+q.mnemo;feedback.classList.add('show');checkBtn.style.display='none';nextBtn.style.display='inline-block';}else{feedback.classList.remove('show');checkBtn.style.display='inline-block';nextBtn.style.display='none';}nextBtn.disabled=(index===total-1&&!isRevealed);prevBtn.disabled=(index===0);if(index===total-1&&isRevealed){nextBtn.textContent='📊 Resultat';nextBtn.onclick=showResults;}else{nextBtn.textContent='Següent →';nextBtn.onclick=()=>goTo(index+1);}}
function selectOption(qIndex,optIndex){if(getCurrentRevealed()[qIndex])return;const ans=getCurrentAnswers();ans[qIndex]=optIndex;if(mode==='retry'&&wrongIndices.length>0){const originalIdx=wrongIndices[qIndex];answers[originalIdx]=optIndex;}renderQuestion(currentIndex);}
function checkAnswer(){const qs=getCurrentQuestions(), ans=getCurrentAnswers(), rev=getCurrentRevealed(), idx=currentIndex;if(ans[idx]===null){alert('Selecciona una opció abans de comprovar.');return;}rev[idx]=true;if(mode==='retry'&&wrongIndices.length>0){const originalIdx=wrongIndices[idx];revealed[originalIdx]=true;}renderQuestion(currentIndex);}
function goTo(index){const qs=getCurrentQuestions();if(index<0||index>=qs.length)return;currentIndex=index;renderQuestion(index);window.scrollTo({top:0,behavior:'auto'});}
function showResults(){const total=PREGUNTES.length;let correctCount=0,wrongCount=0,unanswered=0,detall=[];for(let i=0;i<total;i++){const q=PREGUNTES[i], userAns=answers[i], isRevealed=revealed[i], isCorrect=userAns===q.correcta;if(!isRevealed){unanswered++;detall.push({index:i,q,userAns,isCorrect:false,status:'no respondida'});}else if(isCorrect){correctCount++;detall.push({index:i,q,userAns,isCorrect:true,status:'correcta'});}else{wrongCount++;detall.push({index:i,q,userAns,isCorrect:false,status:'fallada'});}}const percent=Math.round((correctCount/total)*100);finalScore.textContent=correctCount;let msg='';if(correctCount===total)msg='🏆 Perfecte! Excel·lent!';else if(correctCount>=total*0.8)msg='🌟 Molt bé!';else if(correctCount>=total*0.6)msg='👍 Bé, repassa les fallades.';else if(correctCount>=total*0.4)msg='📚 Necessites estudiar més.';else msg='💪 Torna a intentar-ho.';finalMessage.textContent=msg;let html='<div style="font-weight:600;margin-bottom:8px;">📋 Detall</div>';detall.forEach((item,idx)=>{const q=item.q,userLletra=item.userAns!==null?String.fromCharCode(65+item.userAns):'—',correctLletra=String.fromCharCode(65+q.correcta);let icon='',color='';if(item.status==='correcta'){icon='✅';color='#1e7e34';}else if(item.status==='fallada'){icon='❌';color='#b91c1c';}else{icon='⏭️';color='#64748b';}html+='<div class="result-item"><span style="color:'+color+';font-weight:600;">'+icon+' '+(idx+1)+'.</span> <strong>'+q.pregunta+'</strong><br><span style="font-size:13px;">Tria: '+userLletra+' | Correcta: '+correctLletra+'</span><br><span class="justif">💡 '+q.justificacio+'</span>'+(q.mnemo?'<br><span class="mnemo">🧠 '+q.mnemo+'</span>':'')+'</div>';});resultDetail.innerHTML=html;questionArea.classList.add('hidden');resultArea.classList.remove('hidden');const fallades=detall.filter(d=>d.status==='fallada').map(d=>d.index);if(fallades.length>0){retryWrongBtn.style.display='inline-block';retryWrongBtn.onclick=()=>startRetry(fallades);}else{retryWrongBtn.style.display='none';}}
function startRetry(falladesIndices){if(falladesIndices.length===0)return;for(let idx of falladesIndices){answers[idx]=null;revealed[idx]=false;}mode='retry';wrongIndices=falladesIndices;currentIndex=0;resultArea.classList.add('hidden');questionArea.classList.remove('hidden');renderQuestion(0);window.scrollTo({top:0,behavior:'auto'});}
function resetTest(){mode='normal';wrongIndices=[];currentIndex=0;answers=new Array(PREGUNTES.length).fill(null);revealed=new Array(PREGUNTES.length).fill(false);resultArea.classList.add('hidden');questionArea.classList.remove('hidden');renderQuestion(0);window.scrollTo({top:0,behavior:'auto'});}
checkBtn.addEventListener('click',checkAnswer);checkBtn.addEventListener('touchstart',(e)=>{if(!e.target.disabled)checkAnswer();},{passive:true});prevBtn.addEventListener('click',()=>goTo(currentIndex-1));prevBtn.addEventListener('touchstart',(e)=>{if(!e.target.disabled)goTo(currentIndex-1);},{passive:true});resetBtn.addEventListener('click',resetTest);resetBtn.addEventListener('touchstart',resetTest,{passive:true});renderQuestion(0);
</script>
