<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Test Alcalde i Regidories 2026</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif; background: #e9edf2; padding: 16px 12px 40px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; color: #1e293b; }
        .container { max-width: 680px; width: 100%; background: #fff; border-radius: 32px; box-shadow: 0 12px 40px rgba(0,0,0,0.08); padding: 24px 20px 30px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eef2f6; padding-bottom: 14px; margin-bottom: 22px; }
        .header h1 { font-size: 22px; font-weight: 700; color: #0b2b4a; }
        .header h1 small { font-size: 14px; font-weight: 400; color: #64748b; margin-left: 8px; }
        .progress-badge { background: #dbe7f3; color: #0b2b4a; font-weight: 600; padding: 6px 16px; border-radius: 30px; font-size: 15px; white-space: nowrap; }
        .question-number { font-weight: 700; color: #1a4b7a; font-size: 15px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
        .question-text { font-size: 20px; font-weight: 600; line-height: 1.4; margin-bottom: 24px; min-height: 3.2em; color: #0a1e32; }
        .options { display: flex; flex-direction: column; gap: 12px; margin-bottom: 28px; }
        .option { background: #f8fafc; border: 2px solid #dce2ea; border-radius: 16px; padding: 16px 20px; font-size: 17px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 14px; touch-action: manipulation; user-select: none; -webkit-user-select: none; transition: 0.15s; }
        .option:active { transform: scale(0.98); }
        .option .letter { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 50%; background: #dce2ea; color: #1e293b; font-weight: 700; font-size: 16px; flex-shrink: 0; }
        .option.selected { border-color: #1a4b7a; background: #e6eff9; }
        .option.selected .letter { background: #1a4b7a; color: white; }
        .option.correct { border-color: #1e7e34; background: #e6f5ea; }
        .option.correct .letter { background: #1e7e34; color: white; }
        .option.wrong { border-color: #b91c1c; background: #fde8e8; }
        .option.wrong .letter { background: #b91c1c; color: white; }
        .option.disabled { pointer-events: none; opacity: 0.9; }
        .option.disabled:active { transform: none; }
        .feedback { background: #f1f5f9; border-radius: 18px; padding: 18px 20px; margin: 4px 0 24px; display: none; border-left: 6px solid #94a3b8; }
        .feedback.show { display: block; }
        .feedback .badge { display: inline-block; font-weight: 700; font-size: 15px; padding: 4px 18px; border-radius: 30px; margin-bottom: 10px; }
        .badge.correct-badge { background: #d1f0d9; color: #0f5424; }
        .badge.wrong-badge { background: #fcd5d5; color: #8b1a1a; }
        .feedback .justification { font-size: 16px; line-height: 1.5; margin: 8px 0; }
        .feedback .mnemonic { background: #fef7e0; border-radius: 14px; padding: 12px 16px; margin-top: 14px; font-size: 15px; border: 1px solid #f7d97a; color: #7a5800; }
        .feedback .mnemonic strong { font-weight: 700; color: #5f4300; }
        .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 4px; }
        .btn { flex: 1; min-width: 100px; background: #eef2f6; border: none; border-radius: 40px; padding: 14px 18px; font-weight: 600; font-size: 17px; color: #1e293b; cursor: pointer; transition: 0.15s; text-align: center; touch-action: manipulation; }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background: #1a4b7a; color: white; box-shadow: 0 4px 12px rgba(26,75,122,0.25); }
        .btn-primary:disabled { opacity: 0.5; pointer-events: none; box-shadow: none; }
        .btn-secondary { background: #e2e8f0; }
        .btn-success { background: #1e7e34; color: white; box-shadow: 0 4px 12px rgba(30,126,52,0.25); }
        .btn-warning { background: #d97706; color: white; box-shadow: 0 4px 12px rgba(217,119,6,0.25); }
        .result-box { text-align: center; padding: 20px 0 10px; }
        .result-box .score { font-size: 60px; font-weight: 800; color: #0b2b4a; }
        .result-box .label { font-size: 20px; color: #475569; margin-top: 4px; }
        .result-box .message { margin-top: 16px; font-size: 18px; font-weight: 500; }
        .result-detail { margin-top: 20px; text-align: left; max-height: 400px; overflow-y: auto; border-top: 1px solid #e2e8f0; padding-top: 16px; }
        .result-item { padding: 10px 0; border-bottom: 1px solid #e9edf2; font-size: 14px; }
        .result-item .justif { font-size: 13px; background: #f1f5f9; padding: 4px 10px; border-radius: 8px; margin-top: 4px; display: inline-block; }
        .result-item .mnemo { font-size: 13px; background: #fef7e0; padding: 4px 10px; border-radius: 8px; margin-top: 4px; display: inline-block; border: 1px solid #f7d97a; }
        .hidden { display: none !important; }
        @media (max-width: 480px) { .container { padding: 18px 14px 22px; } .question-text { font-size: 18px; } .option { font-size: 15px; padding: 14px 16px; } .btn { font-size: 15px; padding: 12px 10px; min-width: 80px; } .header h1 { font-size: 19px; } }
    </style>
</head>
<body>
<div class="container" id="app">
    <div class="header">
        <h1>🏛️ Alcalde i Regidories <small>Martorell 2026</small></h1>
        <span class="progress-badge" id="progressLabel">1 / 25</span>
    </div>
    <div id="questionArea">
        <div class="question-number"><span id="qNumber">Pregunta 1</span><span id="questionStatus"></span></div>
        <div class="question-text" id="qText">Carregant...</div>
        <div class="options" id="optionsContainer"></div>
        <div class="feedback" id="feedback">
            <div><span class="badge" id="badgeResult">✅ Correcte</span></div>
            <div class="justification" id="justificationText"></div>
            <div class="mnemonic" id="mnemonicText"><strong>🧠 Truc:</strong> </div>
        </div>
        <div class="actions">
            <button class="btn btn-secondary" id="prevBtn" disabled>← Anterior</button>
            <button class="btn btn-primary" id="checkBtn">Comprovar</button>
            <button class="btn btn-primary" id="nextBtn" style="display:none;">Següent →</button>
        </div>
    </div>
    <div id="resultArea" class="result-box hidden">
        <div class="score" id="finalScore">0</div>
        <div class="label">encerts de 25</div>
        <div class="message" id="finalMessage">😊 Bon treball!</div>
        <div style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:16px;">
            <button class="btn btn-success" id="resetBtn">🔄 Tornar a començar</button>
            <button class="btn btn-warning" id="retryWrongBtn" style="display:none;">📝 Repetir fallades</button>
        </div>
        <div class="result-detail" id="resultDetail"></div>
    </div>
</div>
<script>
const PREGUNTES = [
{id:1, pregunta:"Qui és l'actual alcalde de Martorell?", opcions:["Salvador Esteve i Figueras","Xavier Fonollosa Comas","Lluís Amat Ferrer","Martí Flores i Sáez"], correcta:1, justificacio:"Xavier Fonollosa Comas és l'alcalde de Martorell en el mandat 2023-2027.", mnemo:"Xavier Fonollosa → inicials XF, com 'Xavi Font'."},
{id:2, pregunta:"A quin grup municipal pertany l'alcalde Xavier Fonollosa?", opcions:["PSC-CP","ERC-AM","Junts per Martorell","Movem Martorell"], correcta:2, justificacio:"Xavier Fonollosa és de Junts per Martorell.", mnemo:"Junts → l'alcalde va 'junts' amb el seu equip."},
{id:3, pregunta:"Qui és actualment el primer tinent d'alcalde de Martorell?", opcions:["Sergi Corral Barón","Lluís Amat Ferrer","Gerard Mimó Creus","Javier González"], correcta:1, justificacio:"Lluís Amat Ferrer és el primer tinent d'alcalde.", mnemo:"Lluís Amat → primer, com 'Amat' comença per A."},
{id:4, pregunta:"Qui és la segona tinenta d'alcalde?", opcions:["Cristina Dalmau Cerdà","Rosa Cadenas Prados","Soledad Rosende Castillo","Raquel Sans Carné"], correcta:2, justificacio:"Soledad Rosende Castillo és la segona tinenta d'alcalde.", mnemo:"Soledad → segona, com 'S' de segona."},
{id:5, pregunta:"Qui és la tercera tinenta d'alcalde?", opcions:["Cristina Dalmau Cerdà","Elisabet Plaza Tel","Remedios Márquez","Belén Leiva"], correcta:0, justificacio:"Cristina Dalmau Cerdà és la tercera tinenta d'alcalde.", mnemo:"Cristina → tercera, com 'C' de tercera."},
{id:6, pregunta:"Quin regidor coordina l'Àrea Econòmica, d'Organització i Règim Interior?", opcions:["Albert Fernández Claramunt","Lluís Amat Ferrer","Javier González","Lluís Sagarra Sésé"], correcta:1, justificacio:"Lluís Amat Ferrer coordina aquesta àrea.", mnemo:"Lluís Amat → econòmic, com 'Amat' de 'amateur' (administració)."},
{id:7, pregunta:"Qui és la regidora de Benestar Social i Mitjans de Comunicació?", opcions:["Cristina Dalmau Cerdà","Soledad Rosende Castillo","Rosa Cadenas Prados","Remedios Márquez"], correcta:0, justificacio:"Cristina Dalmau Cerdà és la regidora de Benestar Social.", mnemo:"Cristina → benestar, com 'cristina' (cristina = cura)."},
{id:8, pregunta:"Quin regidor és responsable de Cultura?", opcions:["Gerard Mimó Creus","Sergi Corral Barón","Albert Fernández Claramunt","Soulimane Messaoudi"], correcta:1, justificacio:"Sergi Corral Barón és el regidor de Cultura.", mnemo:"Sergi → cultura, com 'ser gent' de cultura."},
{id:9, pregunta:"Qui és la regidora de Promoció Econòmica, Comerç, Mercats i Turisme?", opcions:["Elisabet Plaza Tel","Raquel Sans Carné","Rosa Cadenas Prados","Laura Ruiz"], correcta:2, justificacio:"Rosa Cadenas Prados és la regidora de Promoció Econòmica.", mnemo:"Rosa → promoció, com 'rosa' de comerç."},
{id:10, pregunta:"Quin regidor té atribuïdes les competències de Seguretat Ciutadana i Mobilitat?", opcions:["Lluís Sagarra Sésé","Lluís Amat Ferrer","Sergi Corral Barón","Javier González"], correcta:0, justificacio:"Lluís Sagarra Sésé és el regidor de Seguretat i Mobilitat.", mnemo:"Sagarra → seguretat, com 'S' de seguretat."},
{id:11, pregunta:"Qui és la regidora de Serveis Urbans i Via Pública?", opcions:["Belén Leiva","Elisabet Plaza Tel","Cristina Dalmau Cerdà","Soledad Rosende Castillo"], correcta:1, justificacio:"Elisabet Plaza Tel és la regidora de Serveis Urbans.", mnemo:"Elisabet → urbans, com 'elisa' (carrer)."},
{id:12, pregunta:"Quin regidor és responsable de la Regidoria d'Esports?", opcions:["Sergi Corral Barón","Gerard Mimó Creus","Albert Fernández Claramunt","Lluís Sagarra Sésé"], correcta:1, justificacio:"Gerard Mimó Creus és el regidor d'Esports.", mnemo:"Gerard → esports, com 'gerard' (guerrer)."},
{id:13, pregunta:"Qui és la regidora de Joventut?", opcions:["Raquel Sans Carné","Laura Ruiz","Àngels Cardona","Remedios Márquez"], correcta:0, justificacio:"Raquel Sans Carné és la regidora de Joventut.", mnemo:"Raquel → joventut, com 'raquel' (jove)."},
{id:14, pregunta:"Quin regidor té les competències d'Habitatge i Rehabilitació Urbana i Territorial?", opcions:["Albert Fernández Claramunt","Lluís Amat Ferrer","Gerard Mimó Creus","Javier González"], correcta:0, justificacio:"Albert Fernández Claramunt és el regidor d'Habitatge.", mnemo:"Albert → habitatge, com 'Albert' (habitar)."},
{id:15, pregunta:"Quins dos regidors del PSC es van incorporar al govern municipal?", opcions:["Laura Ruiz i Àngels Cardona","Javier González i Remedios Márquez","Soulimane Messaoudi i Javier González","Remedios Márquez i Belén Leiva"], correcta:1, justificacio:"Javier González i Remedios Márquez són els regidors del PSC incorporats.", mnemo:"Javier i Remedios → PSC, com 'Javi i Reme'."},
{id:16, pregunta:"Quin regidor del PSC és titular de la Regidoria de Transició Digital i Sostenible?", opcions:["Javier González","Soulimane Messaoudi","Sergi Corral","Lluís Amat"], correcta:0, justificacio:"Javier González és el regidor de Transició Digital.", mnemo:"Javier → digital, com 'Javi' (tech)."},
{id:17, pregunta:"Qui és l'actual regidora d'Igualtat?", opcions:["Belén Leiva","Cristina Dalmau","Remedios Márquez","Soledad Rosende"], correcta:2, justificacio:"Remedios Márquez és la regidora d'Igualtat.", mnemo:"Remedios → igualtat, com 'remedio' (remitjar)."},
{id:18, pregunta:"Quines competències manté Belén Leiva després de la reorganització del cartipàs?", opcions:["Cultura i Turisme","Infància i Adolescència","Joventut i Esports","Habitatge i Urbanisme"], correcta:1, justificacio:"Belén Leiva manté Infància i Adolescència.", mnemo:"Belén → infància, com 'belén' (nadal)."},
{id:19, pregunta:"Quants regidors té Junts per Martorell al Ple municipal?", opcions:["14","15","16","18"], correcta:2, justificacio:"Junts per Martorell té 16 regidors.", mnemo:"16 → 'setze' com 'Junts'."},
{id:20, pregunta:"Quants regidors té el PSC al Ple municipal?", opcions:["1","2","3","4"], correcta:1, justificacio:"El PSC té 2 regidors al Ple.", mnemo:"2 → 'dos' com 'PSC'."},
{id:21, pregunta:"Quins grups municipals formen actualment l'oposició?", opcions:["PSC i ERC","Movem Martorell i ERC","Junts i PSC","Només Movem Martorell"], correcta:1, justificacio:"Movem Martorell i ERC són a l'oposició.", mnemo:"Movem i ERC → oposició, com 'M i E'."},
{id:22, pregunta:"Quants regidors formen actualment l'oposició?", opcions:["2","3","4","5"], correcta:1, justificacio:"L'oposició té 3 regidors (Movem Martorell i ERC).", mnemo:"3 → 'tres' com 'oposició'."},
{id:23, pregunta:"Quina de les següents persones és regidora de Movem Martorell?", opcions:["Àngels Cardona","Remedios Márquez","Raquel Sans","Soledad Rosende"], correcta:0, justificacio:"Àngels Cardona és regidora de Movem Martorell.", mnemo:"Àngels → Movem, com 'àngels' (mouen)."},
{id:24, pregunta:"Qui és l'únic regidor d'ERC al Ple municipal?", opcions:["Xavier Fonollosa","Soulimane Messaoudi","Javier González","Lluís Sagarra"], correcta:1, justificacio:"Soulimane Messaoudi és l'únic regidor d'ERC.", mnemo:"Soulimane → ERC, com 'Souli' (sol)."},
{id:25, pregunta:"Després de la incorporació dels dos regidors del PSC, quants membres té l'equip de govern?", opcions:["16","17","18","21"], correcta:2, justificacio:"L'equip de govern té 18 membres (16 de Junts + 2 del PSC).", mnemo:"18 → 'divuit' com 'govern'."}
];
// Lògica idèntica a la dels tests anteriors
let answers=new Array(PREGUNTES.length).fill(null), revealed=new Array(PREGUNTES.length).fill(false), currentIndex=0, mode='normal', wrongIndices=[];
const $=id=>document.getElementById(id), questionArea=$('questionArea'), resultArea=$('resultArea'), progressLabel=$('progressLabel'), qNumber=$('qNumber'), questionStatus=$('questionStatus'), qText=$('qText'), optionsContainer=$('optionsContainer'), feedback=$('feedback'), badgeResult=$('badgeResult'), justificationText=$('justificationText'), mnemonicText=$('mnemonicText'), checkBtn=$('checkBtn'), nextBtn=$('nextBtn'), prevBtn=$('prevBtn'), resetBtn=$('resetBtn'), retryWrongBtn=$('retryWrongBtn'), finalScore=$('finalScore'), finalMessage=$('finalMessage'), resultDetail=$('resultDetail');
function getCurrentQuestions(){if(mode==='retry'&&wrongIndices.length>0)return wrongIndices.map(i=>PREGUNTES[i]);return PREGUNTES;}
function getCurrentAnswers(){if(mode==='retry'&&wrongIndices.length>0)return wrongIndices.map(i=>answers[i]);return answers;}
function getCurrentRevealed(){if(mode==='retry'&&wrongIndices.length>0)return wrongIndices.map(i=>revealed[i]);return revealed;}
function renderQuestion(index){const qs=getCurrentQuestions(), ans=getCurrentAnswers(), rev=getCurrentRevealed();if(index>=qs.length){showResults();return;}const q=qs[index], userAnswer=ans[index], isRevealed=rev[index], total=qs.length;progressLabel.textContent=index+1+' / '+total;qNumber.innerHTML='<span>Pregunta '+(index+1)+'</span><span id="questionStatus"></span>';if(isRevealed){const isCorrect=userAnswer===q.correcta;document.getElementById('questionStatus').textContent=isCorrect?'✅':'❌';}else{document.getElementById('questionStatus').textContent='';}qText.textContent=q.pregunta;optionsContainer.innerHTML='';const letters=['a','b','c','d'];q.opcions.forEach((text,i)=>{const div=document.createElement('div');div.className='option';if(userAnswer===i)div.classList.add('selected');if(isRevealed){div.classList.add('disabled');if(i===q.correcta)div.classList.add('correct');if(userAnswer===i&&i!==q.correcta)div.classList.add('wrong');}div.innerHTML='<span class="letter">'+letters[i]+'</span> '+text;div.dataset.index=i;if(!isRevealed){const handler=()=>selectOption(index,i);div.addEventListener('click',handler);div.addEventListener('touchstart',(e)=>{if(!e.target.closest('.option.disabled'))handler();},{passive:true});}optionsContainer.appendChild(div);});if(isRevealed){const isCorrect=userAnswer===q.correcta;badgeResult.textContent=isCorrect?'✅ Correcte':'❌ Incorrecte';badgeResult.className='badge '+(isCorrect?'correct-badge':'wrong-badge');justificationText.textContent=q.justificacio;mnemonicText.innerHTML='<strong>🧠 Truc:</strong> '+q.mnemo;feedback.classList.add('show');checkBtn.style.display='none';nextBtn.style.display='inline-block';}else{feedback.classList.remove('show');checkBtn.style.display='inline-block';nextBtn.style.display='none';}nextBtn.disabled=(index===total-1&&!isRevealed);prevBtn.disabled=(index===0);if(index===total-1&&isRevealed){nextBtn.textContent='📊 Resultat';nextBtn.onclick=showResults;}else{nextBtn.textContent='Següent →';nextBtn.onclick=()=>goTo(index+1);}}
function selectOption(qIndex,optIndex){if(getCurrentRevealed()[qIndex])return;const ans=getCurrentAnswers();ans[qIndex]=optIndex;if(mode==='retry'&&wrongIndices.length>0){const originalIdx=wrongIndices[qIndex];answers[originalIdx]=optIndex;}renderQuestion(currentIndex);}
function checkAnswer(){const qs=getCurrentQuestions(), ans=getCurrentAnswers(), rev=getCurrentRevealed(), idx=currentIndex;if(ans[idx]===null){alert('Selecciona una opció abans de comprovar.');return;}rev[idx]=true;if(mode==='retry'&&wrongIndices.length>0){const originalIdx=wrongIndices[idx];revealed[originalIdx]=true;}renderQuestion(currentIndex);}
function goTo(index){const qs=getCurrentQuestions();if(index<0||index>=qs.length)return;currentIndex=index;renderQuestion(index);window.scrollTo({top:0,behavior:'auto'});}
function showResults(){const total=PREGUNTES.length;let correctCount=0,wrongCount=0,unanswered=0,detall=[];for(let i=0;i<total;i++){const q=PREGUNTES[i], userAns=answers[i], isRevealed=revealed[i], isCorrect=userAns===q.correcta;if(!isRevealed){unanswered++;detall.push({index:i,q,userAns,isCorrect:false,status:'no respondida'});}else if(isCorrect){correctCount++;detall.push({index:i,q,userAns,isCorrect:true,status:'correcta'});}else{wrongCount++;detall.push({index:i,q,userAns,isCorrect:false,status:'fallada'});}}const percent=Math.round((correctCount/total)*100);finalScore.textContent=correctCount;let msg='';if(correctCount===total)msg='🏆 Perfecte!';else if(correctCount>=total*0.8)msg='🌟 Molt bé!';else if(correctCount>=total*0.6)msg='👍 Bé, repassa les fallades.';else if(correctCount>=total*0.4)msg='📚 Necessites estudiar més.';else msg='💪 Torna a intentar-ho.';finalMessage.textContent=msg;let html='<div style="font-weight:600;margin-bottom:8px;">📋 Detall</div>';detall.forEach((item,idx)=>{const q=item.q,userLletra=item.userAns!==null?String.fromCharCode(65+item.userAns):'—',correctLletra=String.fromCharCode(65+q.correcta);let icon='',color='';if(item.status==='correcta'){icon='✅';color='#1e7e34';}else if(item.status==='fallada'){icon='❌';color='#b91c1c';}else{icon='⏭️';color='#64748b';}html+='<div class="result-item"><span style="color:'+color+';font-weight:600;">'+icon+' '+(idx+1)+'.</span> <strong>'+q.pregunta+'</strong><br><span style="font-size:13px;">Tria: '+userLletra+' | Correcta: '+correctLletra+'</span><br><span class="justif">💡 '+q.justificacio+'</span>'+(q.mnemo?'<br><span class="mnemo">🧠 '+q.mnemo+'</span>':'')+'</div>';});resultDetail.innerHTML=html;questionArea.classList.add('hidden');resultArea.classList.remove('hidden');const fallades=detall.filter(d=>d.status==='fallada').map(d=>d.index);if(fallades.length>0){retryWrongBtn.style.display='inline-block';retryWrongBtn.onclick=()=>startRetry(fallades);}else{retryWrongBtn.style.display='none';}}
function startRetry(falladesIndices){if(falladesIndices.length===0)return;for(let idx of falladesIndices){answers[idx]=null;revealed[idx]=false;}mode='retry';wrongIndices=falladesIndices;currentIndex=0;resultArea.classList.add('hidden');questionArea.classList.remove('hidden');renderQuestion(0);window.scrollTo({top:0,behavior:'auto'});}
function resetTest(){mode='normal';wrongIndices=[];currentIndex=0;answers=new Array(PREGUNTES.length).fill(null);revealed=new Array(PREGUNTES.length).fill(false);resultArea.classList.add('hidden');questionArea.classList.remove('hidden');renderQuestion(0);window.scrollTo({top:0,behavior:'auto'});}
checkBtn.addEventListener('click',checkAnswer);checkBtn.addEventListener('touchstart',(e)=>{if(!e.target.disabled)checkAnswer();},{passive:true});prevBtn.addEventListener('click',()=>goTo(currentIndex-1));prevBtn.addEventListener('touchstart',(e)=>{if(!e.target.disabled)goTo(currentIndex-1);},{passive:true});resetBtn.addEventListener('click',resetTest);resetBtn.addEventListener('touchstart',resetTest,{passive:true});renderQuestion(0);
</script>
</body>
</html>
