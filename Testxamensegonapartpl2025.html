    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        .option.selected { border-color: #1a4b7a; background: #e6eff9; }
        .option.selected .letter { background: #1a4b7a; color: white; }
        .option.correct { border-color: #1e7e34; background: #e6f5ea; }
        .option.correct .letter { background: #1e7e34; color: white; }
        .option.wrong { border-color: #b91c1c; background: #fde8e8; }
        .option.wrong .letter { background: #b91c1c; color: white; }
        .option.disabled { pointer-events: none; opacity: 0.9; }
        .option.disabled:active { transform: none; }
        .feedback { background: #f1f5f9; border-radius: 18px; padding: 18px 20px; margin: 4px 0 24px; display: none; border-left: 6px solid #94a3b8; }

        .feedback .justification { font-size: 16px; line-height: 1.5; margin: 8px 0; }
        .feedback .mnemonic { background: #fef7e0; border-radius: 14px; padding: 12px 16px; margin-top: 14px; font-size: 15px; border: 1px solid #f7d97a; color: #7a5800; }
        .feedback .mnemonic strong { font-weight: 700; color: #5f4300; }
        .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 4px; }
        .btn { flex: 1; min-width: 100px; background: #eef2f6; border: none; border-radius: 40px; padding: 14px 18px; font-weight: 600; font-size: 17px; color: #1e293b; cursor: pointer; transition: 0.15s; text-align: center; touch-action: manipulation; }

        .btn-secondary { background: #e2e8f0; }
        .btn-success { background: #1e7e34; color: white; box-shadow: 0 4px 12px rgba(30,126,52,0.25); }
        .btn-warning { background: #d97706; color: white; box-shadow: 0 4px 12px rgba(217,119,6,0.25); }
        .result-box { text-align: center; padding: 20px 0 10px; }
        .result-box .score { font-size: 60px; font-weight: 800; color: #0b2b4a; }
        .result-box .label { font-size: 20px; color: #475569; margin-top: 4px; }
        .result-box .message { margin-top: 16px; font-size: 18px; font-weight: 500; }
        .result-detail { margin-top: 20px; text-align: left; max-height: 400px; overflow-y: auto; border-top: 1px solid #e2e8f0; padding-top: 16px; }
        .result-item { padding: 10px 0; border-bottom: 1px solid #e9edf2; font-size: 14px; }
        .result-item .justif { font-size: 13px; background: #f1f5f9; padding: 4px 10px; border-radius: 8px; margin-top: 4px; display: inline-block; }
        .result-item .mnemo { font-size: 13px; background: #fef7e0; padding: 4px 10px; border-radius: 8px; margin-top: 4px; display: inline-block; border: 1px solid #f7d97a; }

<script>
// PREGUNTES EXTRETES DEL CORRECTOR OFICIAL DE LA SEGONA PART - MARTORELL 2025
const PREGUNTES = [
{id:1, pregunta:"Segons la Constitució espanyola, Espanya es constitueix en:", opcions:["Un estat de dret democràtic","Un estat social i democràtic de dret","Un estat polític i democràtic"], correcta:1, justificacio:"L'article 1.1 CE estableix que Espanya es constitueix en un Estat social i democràtic de Dret.", mnemo:"Social i Democràtic → 'SD', com 'Social i Democràtic'."},
{id:2, pregunta:"El Tribunal Constitucional està integrat per un total de:", opcions:["10 membres","12 membres","20 membres"], correcta:1, justificacio:"El Tribunal Constitucional està integrat per 12 membres (art. 159 CE).", mnemo:"TC = 12 membres, com '12' de 'Tribunal'."},
{id:3, pregunta:"Quin d'aquests drets NO és un dret fonamental?", opcions:["Dret a contribuir al sosteniment de la despesa pública d'acord amb la seva capacitat econòmica","Dret a l'honor, a la intimitat personal i familiar i a la pròpia imatge","Dret a triar lliurement la seva residència i a circular pel territori nacional"], correcta:0, justificacio:"El dret a contribuir a les despeses públiques és un deure constitucional (art. 31 CE), no un dret fonamental.", mnemo:"Contribuir → deure, no dret, com 'C'."},
{id:4, pregunta:"Quina d'aquestes és una institució de la Generalitat de Catalunya?", opcions:["El Defensor del Pueblo","El Consell de política pacífica","El Consell de garanties estatutàries"], correcta:2, justificacio:"El Consell de Garanties Estatutàries és una institució de la Generalitat (art. 76 Estatut d'Autonomia).", mnemo:"Garanties → Generalitat, com 'G'."},
{id:5, pregunta:"L'incompliment de la jornada de treball sense causa justificada és, segons la Llei 16/1991 de Policies Locals, una falta...", opcions:["Molt Greu","Greu","Lleu"], correcta:1, justificacio:"L'incompliment injustificat de la jornada laboral és una falta greu segons la Llei 16/1991.", mnemo:"Incompliment → greu, com 'G'."},
{id:6, pregunta:"Agredir clavant una bufetada a un metge de capçalera del servei públic de sanitat mentre treballa a l'ambulatori d'urgències, estariem davant d'un delicte de:", opcions:["Agressió agreujat","Lesions agreujades","Atemptat"], correcta:2, justificacio:"Agredir una autoritat o funcionari públic és delicte d'atemptat (arts. 550-552 CP).", mnemo:"Atemptat → autoritat, com 'A'."},
{id:7, pregunta:"La Policia de Catalunya ha de ser especialment atenta en el tracte que dispensa a les persones:", opcions:["físicament, psicològicament i econòmicament vulnerables","físicament, psicològicament, socialment i econòmicament vulnerables","físicament, socialment i econòmicament vulnerables"], correcta:1, justificacio:"El Codi d'ètica policial estableix que s'ha de ser especialment atent amb les persones físicament, psicològicament, socialment i econòmicament vulnerables.", mnemo:"4 vulnerabilitats → FPSE, com 'F'."},
{id:8, pregunta:"D'acord al Codi Penal, comet delicte contra la salut pública:", opcions:["El que, sense estar degudament autoritzat, elabori substàncies nocives per la salut","El que estigui degudament autoritzat, elabori substàncies nocives","El que consumeix substàncies estupefaents a la via pública"], correcta:0, justificacio:"L'art. 361 CP tipifica com a delicte l'elaboració de substàncies nocives sense autorització.", mnemo:"Sense autorització → delicte, com 'S'."},
{id:9, pregunta:"La Llei 39/2015, del Procediment Administratiu Comú s'aplica al sector públic, que compren:", opcions:["L'Administració General de l'Estat, les CCAA, l'Administració local i el sector públic institucional","L'Administració General de l'Estat, les CCAA i l'Administració local","L'Administració General de l'Estat, les CCAA i el sector privat"], correcta:0, justificacio:"L'art. 2.1 LPACAP defineix el sector públic incloent l'Administració General, CCAA, local i sector públic institucional.", mnemo:"Sector públic → 4 nivells, com '4'."},
{id:10, pregunta:"Quina acció correspon al principi bàsic d'actuació de relacions amb la comunitat de la LO 2/1986?", opcions:["Complir amb diligència la detenció","Exercir funcions amb respecte a la CE","Tracte correcte i acurat amb els ciutadans, auxiliar i protegir-los"], correcta:2, justificacio:"L'art. 5.2 de la LO 2/1986 estableix el tracte correcte i acurat amb els ciutadans com a principi bàsic d'actuació.", mnemo:"Tracte correcte → ciutadans, com 'T'."},
{id:11, pregunta:"Segons el Codi Penal, resistir-se a un agent de policia en l'exercici de les seves funcions és un delicte?", opcions:["No, en cap cas","Sí, sempre","Sí, si la resistència es considera greu"], correcta:2, justificacio:"La resistència greu a l'autoritat és delicte (art. 556 CP).", mnemo:"Resistència greu → delicte, com 'R'."},
{id:12, pregunta:"El Reglament General de Circulació estableix que entre la primera i la segona prova d'alcoholèmia hi ha un temps mínim de:", opcions:["5 minuts","10 minuts","15 minuts"], correcta:1, justificacio:"L'art. 14 del RGC estableix un temps mínim de 10 minuts entre les dues proves.", mnemo:"10 minuts → alcoholèmia, com '10'."},
{id:13, pregunta:"D'acord a la LO 4/2015 de Protecció de la Seguretat Ciutadana, en compliment de quines funcions, podran identificar a persones els agents?", opcions:["Indagació i prevenció delictiva","Prevenció delictiva i investigació","Prevenció delictiva i tramitació jurídica"], correcta:0, justificacio:"L'art. 16.1 de la LO 4/2015 permet la identificació en funcions d'indagació i prevenció delictiva.", mnemo:"Indagació i prevenció → 'IP', com 'I'."},
{id:14, pregunta:"L'Estatut d'Autonomia de Catalunya té:", opcions:["Rang de Llei Ordinària","Rang de Llei Orgànica","Rang de Carta Magna"], correcta:1, justificacio:"L'Estatut d'Autonomia de Catalunya és una Llei Orgànica (art. 81 CE).", mnemo:"Estatut → Llei Orgànica, com 'O'."},
{id:15, pregunta:"D'acord amb el Decret 219/1996, l'arma reglamentària haurà de ser:", opcions:["Propietat de l'agent","Propietat de l'Ajuntament","Propietat del cap de la policia"], correcta:1, justificacio:"L'arma reglamentària és propietat de l'Ajuntament (Decret 219/1996).", mnemo:"Arma → Ajuntament, com 'A'."},
{id:16, pregunta:"Els policies locals hauran de passar una revisió psicotècnica per a l'ús de l'arma reglamentària:", opcions:["Cada any","Cada dos anys","Cada 5 anys"], correcta:1, justificacio:"El Decret 219/1996 estableix la revisió psicotècnica cada dos anys.", mnemo:"2 anys → psicotècnic, com '2'."},
{id:17, pregunta:"Quines penes comporten el delicte d'alcoholèmia per conducció sota la influència de begudes alcohòliques?", opcions:["Presó de 3 a 6 mesos i multa de 6 a 12 mesos","Treballs en benefici de la comunitat","Totes les respostes són correctes"], correcta:2, justificacio:"L'art. 379 CP preveu presó, multa i treballs en benefici de la comunitat.", mnemo:"Totes → alcoholèmia, com 'T'."},
{id:18, pregunta:"Un ciclomotor haurà de passar per primera vegada la ITV?", opcions:["Als tres anys","Als quatre anys","Als cinc anys"], correcta:0, justificacio:"Els ciclomotors passen la ITV per primera vegada als 3 anys (RD 920/2017).", mnemo:"3 anys → ciclomotor, com '3'."},
{id:19, pregunta:"D'acord amb la Llei 16/1991, els policies locals poden exercir el dret a vaga?", opcions:["No","Sí","Sí amb permís de l'Alcalde"], correcta:0, justificacio:"Els policies locals no poden exercir el dret de vaga (art. 38 Llei 16/1991).", mnemo:"No → vaga, com 'N'."},
{id:20, pregunta:"D'acord amb l'article 51 de la Llei 16/1991, els policies locals que concebixin les faltes molt greus i greus consumades incorreran en una falta:", opcions:["En grau inferior","En grau superior","En el mateix grau"], correcta:0, justificacio:"L'art. 51 estableix la responsabilitat en grau inferior per a faltes molt greus i greus consumades.", mnemo:"Grau inferior → consumades, com 'I'."},
{id:21, pregunta:"Quin és l'òrgan competent per a l'aprovació definitiva d'una ordenança?", opcions:["L'alcalde president","La Junta de Govern Local","El Ple"], correcta:2, justificacio:"L'aprovació definitiva de les ordenances correspon al Ple (art. 49.1 LRBRL).", mnemo:"Ordenança → Ple, com 'P'."},
{id:22, pregunta:"D'acord amb la normativa de règim local, quina d'aquestes atribucions correspon a l'alcalde?", opcions:["Representar l'ajuntament","Control i fiscalització dels òrgans de govern","Aprovació del reglament orgànic i de les ordenances"], correcta:0, justificacio:"L'alcalde representa l'ajuntament (art. 21.1 LRBRL).", mnemo:"Alcalde → representar, com 'R'."},
{id:23, pregunta:"D'acord amb la normativa de règim local, qui aprova la plantilla i la relació de llocs de treball del personal municipal?", opcions:["El cap de Recursos Humans","La Junta de Govern Local","El Ple"], correcta:2, justificacio:"L'aprovació de la plantilla i RLT correspon al Ple (art. 22.2 LRBRL).", mnemo:"Plantilla → Ple, com 'P'."},
{id:24, pregunta:"El dret a la protecció de dades personals:", opcions:["És un dret que també es reconeix a les persones jurídiques","És un dret fonamental reconegut constitucionalment","No té la consideració de dret, és un bé jurídic protegit legalment"], correcta:1, justificacio:"La protecció de dades és un dret fonamental (art. 18.4 CE).", mnemo:"Protecció de dades → dret fonamental, com 'F'."},
{id:25, pregunta:"Segons l'article 1 de la LO 2/1986, la Seguretat Pública és:", opcions:["Competència exclusiva de l'Estat","Competència compartida amb les CCAA","Competència exclusiva del ministre de l'Interior"], correcta:0, justificacio:"L'art. 1 de la LO 2/1986 estableix que la Seguretat Pública és competència exclusiva de l'Estat.", mnemo:"Seguretat Pública → Estat, com 'E'."},
{id:26, pregunta:"Quina d'aquestes funcions no correspon a les Juntes Locals de Seguretat?", opcions:["Analitzar la situació de la seguretat pública","Conèixer els serveis de seguretat privada autoritzats","Conèixer qüestions organitzatives i operatives entre Mossos i Policies Locals"], correcta:1, justificacio:"Les Juntes Locals no tenen competències sobre seguretat privada; això correspon a la Junta de Seguretat de Catalunya.", mnemo:"Seguretat privada → no JLS, com 'P'."},
{id:27, pregunta:"Segons la Llei 4/2003, presideix la Junta Local de Seguretat:", opcions:["L'alcalde","El regidor de Seguretat Ciutadana","El delegat territorial del Govern"], correcta:0, justificacio:"L'art. 21.1 de la Llei 4/2003 estableix que la Junta Local de Seguretat és presidida per l'alcalde.", mnemo:"JLS → alcalde, com 'A'."},
{id:28, pregunta:"Segons l'article 37 de la LO 4/2015, NO és una infracció lleu:", opcions:["Escalament d'edificis o monuments sense autorització","Consum de begudes alcohòliques en llocs públics","Desobediència o resistència a l'autoritat o agents"], correcta:2, justificacio:"La desobediència o resistència a l'autoritat és infracció greu (art. 37.6 LO 4/2015).", mnemo:"Desobediència → greu, com 'G'."},
{id:29, pregunta:"Qui amb ànim de lucre, prengui les coses mobles alienes sense la voluntat del seu propietari, serà autor d'un:", opcions:["Delicte de robatori amb força","Delicte greu de furt","Delicte de furt"], correcta:2, justificacio:"La sostracció de coses mobles alienes sense violència o intimidació és delicte de furt (art. 234 CP).", mnemo:"Furt → ànim de lucre, com 'F'."},
{id:30, pregunta:"On està ubicat el Pont del Diable?", opcions:["A la Vila","Buenos Aires","Pou del Merli"], correcta:0, justificacio:"El Pont del Diable de Martorell està ubicat a la Vila (zona del pont romà).", mnemo:"Pont del Diable → Vila, com 'V'."},
{id:31, pregunta:"Quant pot durar com a màxim la detenció d'un menor per funcionaris de policia?", opcions:["24 hores","48 hores","72 hores"], correcta:0, justificacio:"La detenció de menors no pot superar les 24 hores (art. 17 Llei Orgànica 5/2000).", mnemo:"24 hores → menor, com '24'."},
{id:32, pregunta:"El període de pràctiques al municipi, segons el Decret 233/2002, no pot ser:", opcions:["Inferior a 6 mesos ni superior a 12 mesos","Inferior a 3 mesos ni superior a 12 mesos","Inferior a 3 mesos ni superior a 6 mesos"], correcta:0, justificacio:"L'art. 13 del Decret 233/2002 estableix un període de pràctiques entre 6 i 12 mesos.", mnemo:"6-12 mesos → pràctiques, com '6' i '12'."},
{id:33, pregunta:"Quin és l'objectiu principal del Codi de conducta per a funcionaris encarregats de fer complir la llei?", opcions:["Establir protocols en situacions d'emergència","Promoure el respecte als drets humans i les llibertats fonamentals","Definir les penes per a diferents tipus de delictes"], correcta:1, justificacio:"El Codi de conducta té com a objectiu promoure el respecte als drets humans i les llibertats fonamentals.", mnemo:"Codi → drets humans, com 'D'."},
{id:34, pregunta:"Quin és el propòsit principal de la coordinació entre diferents cossos policials?", opcions:["Establir una jerarquia de comandament","Millorar l'eficàcia en la lluita contra la delinquència","Garantir l'autonomia total"], correcta:1, justificacio:"La coordinació policial millora l'eficàcia en la lluita contra la delinquència i garanteix la seguretat pública.", mnemo:"Coordinació → eficàcia, com 'E'."},
{id:35, pregunta:"Quin és l'objectiu principal de la Llei 4/2003 d'Ordenació del Sistema de Seguretat Pública de Catalunya?", opcions:["Establir un marc normatiu per a la formació","Regular l'organització i funcionament del sistema de seguretat pública","Definir les competències de les forces a tot l'Estat"], correcta:1, justificacio:"La Llei 4/2003 regula l'organització i funcionament del sistema de seguretat pública a Catalunya.", mnemo:"Llei 4/2003 → sistema de seguretat, com 'S'."},
{id:36, pregunta:"Segons l'article 31 del RD 818/2009, quina és la validesa del permís internacional per a conduir?", opcions:["Un any","Dos anys","Tres anys"], correcta:0, justificacio:"El permís internacional de conducció té validesa d'un any (art. 31 RD 818/2009).", mnemo:"Permís internacional → 1 any, com '1'."},
{id:37, pregunta:"Segons la Llei 11/2009, quina d'aquestes conductes NO és infracció lleu?", opcions:["No tenir fulls de reclamació","Incomplir la normativa sobre venda d'entrades","Dur a terme actes que atemptin contra la llibertat sexual"], correcta:2, justificacio:"Els actes que atempten contra la llibertat sexual són infraccions greus (Llei 11/2009).", mnemo:"Llibertat sexual → greu, com 'G'."},

// Lògica del test
let answers=new Array(PREGUNTES.length).fill(null), revealed=new Array(PREGUNTES.length).fill(false), currentIndex=0, mode='normal', wrongIndices=[];
const $=id=>document.getElementById(id), questionArea=$('questionArea'), resultArea=$('resultArea'), progressLabel=$('progressLabel'), qNumber=$('qNumber'), questionStatus=$('questionStatus'), qText=$('qText'), optionsContainer=$('optionsContainer'), feedback=$('feedback'), badgeResult=$('badgeResult'), justificationText=$('justificationText'), mnemonicText=$('mnemonicText'), checkBtn=$('checkBtn'), nextBtn=$('nextBtn'), prevBtn=$('prevBtn'), resetBtn=$('resetBtn'), retryWrongBtn=$('retryWrongBtn'), finalScore=$('finalScore'), finalMessage=$('finalMessage'), resultDetail=$('resultDetail');
function getCurrentQuestions(){if(mode==='retry'&&wrongIndices.length>0)return wrongIndices.map(i=>PREGUNTES[i]);return PREGUNTES;}
function getCurrentAnswers(){if(mode==='retry'&&wrongIndices.length>0)return wrongIndices.map(i=>answers[i]);return answers;}
function getCurrentRevealed(){if(mode==='retry'&&wrongIndices.length>0)return wrongIndices.map(i=>revealed[i]);return revealed;}
function renderQuestion(index){const qs=getCurrentQuestions(), ans=getCurrentAnswers(), rev=getCurrentRevealed();if(index>=qs.length){showResults();return;}const q=qs[index], userAnswer=ans[index], isRevealed=rev[index], total=qs.length;progressLabel.textContent=index+1+' / '+total;qNumber.innerHTML='<span>Pregunta '+(index+1)+'</span><span id="questionStatus"></span>';if(isRevealed){const isCorrect=userAnswer===q.correcta;document.getElementById('questionStatus').textContent=isCorrect?'✅':'❌';}else{document.getElementById('questionStatus').textContent='';}qText.textContent=q.pregunta;optionsContainer.innerHTML='';const letters=['a','b','c'];q.opcions.forEach((text,i)=>{const div=document.createElement('div');div.className='option';if(userAnswer===i)div.classList.add('selected');if(isRevealed){div.classList.add('disabled');if(i===q.correcta)div.classList.add('correct');if(userAnswer===i&&i!==q.correcta)div.classList.add('wrong');}div.innerHTML='<span class="letter">'+letters[i]+'</span> '+text;div.dataset.index=i;if(!isRevealed){const handler=()=>selectOption(index,i);div.addEventListener('click',handler);div.addEventListener('touchstart',(e)=>{if(!e.target.closest('.option.disabled'))handler();},{passive:true});}optionsContainer.appendChild(div);});if(isRevealed){const isCorrect=userAnswer===q.correcta;badgeResult.textContent=isCorrect?'✅ Correcte':'❌ Incorrecte';badgeResult.className='badge '+(isCorrect?'correct-badge':'wrong-badge');justificationText.textContent=q.justificacio;mnemonicText.innerHTML='<strong>🧠 Truc:</strong> '+q.mnemo;feedback.classList.add('show');checkBtn.style.display='none';nextBtn.style.display='inline-block';}else{feedback.classList.remove('show');checkBtn.style.display='inline-block';nextBtn.style.display='none';}nextBtn.disabled=(index===total-1&&!isRevealed);prevBtn.disabled=(index===0);if(index===total-1&&isRevealed){nextBtn.textContent='📊 Resultat';nextBtn.onclick=showResults;}else{nextBtn.textContent='Següent →';nextBtn.onclick=()=>goTo(index+1);}}
function selectOption(qIndex,optIndex){if(getCurrentRevealed()[qIndex])return;const ans=getCurrentAnswers();ans[qIndex]=optIndex;if(mode==='retry'&&wrongIndices.length>0){const originalIdx=wrongIndices[qIndex];answers[originalIdx]=optIndex;}renderQuestion(currentIndex);}
function checkAnswer(){const qs=getCurrentQuestions(), ans=getCurrentAnswers(), rev=getCurrentRevealed(), idx=currentIndex;if(ans[idx]===null){alert('Selecciona una opció abans de comprovar.');return;}rev[idx]=true;if(mode==='retry'&&wrongIndices.length>0){const originalIdx=wrongIndices[idx];revealed[originalIdx]=true;}renderQuestion(currentIndex);}
function goTo(index){const qs=getCurrentQuestions();if(index<0||index>=qs.length)return;currentIndex=index;renderQuestion(index);window.scrollTo({top:0,behavior:'auto'});}
function showResults(){const total=PREGUNTES.length;let correctCount=0,wrongCount=0,unanswered=0,detall=[];for(let i=0;i<total;i++){const q=PREGUNTES[i], userAns=answers[i], isRevealed=revealed[i], isCorrect=userAns===q.correcta;if(!isRevealed){unanswered++;detall.push({index:i,q,userAns,isCorrect:false,status:'no respondida'});}else if(isCorrect){correctCount++;detall.push({index:i,q,userAns,isCorrect:true,status:'correcta'});}else{wrongCount++;detall.push({index:i,q,userAns,isCorrect:false,status:'fallada'});}}const percent=Math.round((correctCount/total)*100);finalScore.textContent=correctCount;let msg='';if(correctCount===total)msg='🏆 Perfecte! Excel·lent!';else if(correctCount>=total*0.8)msg='🌟 Molt bé!';else if(correctCount>=total*0.6)msg='👍 Bé, repassa les fallades.';else if(correctCount>=total*0.4)msg='📚 Necessites estudiar més.';else msg='💪 Torna a intentar-ho.';finalMessage.textContent=msg;let html='<div style="font-weight:600;margin-bottom:8px;">📋 Detall</div>';detall.forEach((item,idx)=>{const q=item.q,userLletra=item.userAns!==null?String.fromCharCode(65+item.userAns):'—',correctLletra=String.fromCharCode(65+q.correcta);let icon='',color='';if(item.status==='correcta'){icon='✅';color='#1e7e34';}else if(item.status==='fallada'){icon='❌';color='#b91c1c';}else{icon='⏭️';color='#64748b';}html+='<div class="result-item"><span style="color:'+color+';font-weight:600;">'+icon+' '+(idx+1)+'.</span> <strong>'+q.pregunta+'</strong><br><span style="font-size:13px;">Tria: '+userLletra+' | Correcta: '+correctLletra+'</span><br><span class="justif">💡 '+q.justificacio+'</span>'+(q.mnemo?'<br><span class="mnemo">🧠 '+q.mnemo+'</span>':'')+'</div>';});resultDetail.innerHTML=html;questionArea.classList.add('hidden');resultArea.classList.remove('hidden');const fallades=detall.filter(d=>d.status==='fallada').map(d=>d.index);if(fallades.length>0){retryWrongBtn.style.display='inline-block';retryWrongBtn.onclick=()=>startRetry(fallades);}else{retryWrongBtn.style.display='none';}}
function startRetry(falladesIndices){if(falladesIndices.length===0)return;for(let idx of falladesIndices){answers[idx]=null;revealed[idx]=false;}mode='retry';wrongIndices=falladesIndices;currentIndex=0;resultArea.classList.add('hidden');questionArea.classList.remove('hidden');renderQuestion(0);window.scrollTo({top:0,behavior:'auto'});}
function resetTest(){mode='normal';wrongIndices=[];currentIndex=0;answers=new Array(PREGUNTES.length).fill(null);revealed=new Array(PREGUNTES.length).fill(false);resultArea.classList.add('hidden');questionArea.classList.remove('hidden');renderQuestion(0);window.scrollTo({top:0,behavior:'auto'});}
checkBtn.addEventListener('click',checkAnswer);checkBtn.addEventListener('touchstart',(e)=>{if(!e.target.disabled)checkAnswer();},{passive:true});prevBtn.addEventListener('click',()=>goTo(currentIndex-1));prevBtn.addEventListener('touchstart',(e)=>{if(!e.target.disabled)goTo(currentIndex-1);},{passive:true});resetBtn.addEventListener('click',resetTest);resetBtn.addEventListener('touchstart',resetTest,{passive:true});renderQuestion(0);
</script>
