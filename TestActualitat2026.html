<!DOCTYPE html>
<html lang="ca">
<head>

    <title>Actualitat 2026 · 30 preguntes</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif; background: #e9edf2; padding: 16px 12px 40px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; color: #1e293b; }
        .container { max-width: 680px; width: 100%; background: #fff; border-radius: 32px; box-shadow: 0 12px 40px rgba(0,0,0,0.08); padding: 24px 20px 30px; }

        .option.selected { border-color: #1a4b7a; background: #e6eff9; }
        .option.selected .letter { background: #1a4b7a; color: white; }
        .option.correct { border-color: #1e7e34; background: #e6f5ea; }
        .option.correct .letter { background: #1e7e34; color: white; }
        .option.wrong { border-color: #b91c1c; background: #fde8e8; }
        .option.wrong .letter { background: #b91c1c; color: white; }
        .option.disabled { pointer-events: none; opacity: 0.9; }

        .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 4px; }

        .btn:active { transform: scale(0.96); }
        .btn-primary { background: #1a4b7a; color: white; box-shadow: 0 4px 12px rgba(26,75,122,0.25); }
        .btn-primary:disabled { opacity: 0.5; pointer-events: none; box-shadow: none; }
        .btn-secondary { background: #e2e8f0; }
        .btn-success { background: #1e7e34; color: white; box-shadow: 0 4px 12px rgba(30,126,52,0.25); }
        .btn-warning { background: #d97706; color: white; box-shadow: 0 4px 12px rgba(217,119,6,0.25); }
        .result-box { text-align: center; padding: 20px 0 10px; }
        .result-box .score { font-size: 60px; font-weight: 800; color: #0b2b4a; }
        .result-box .label { font-size: 20px; color: #475569; margin-top: 4px; }
        .result-box .message { margin-top: 16px; font-size: 18px; font-weight: 500; }
        .result-detail { margin-top: 20px; text-align: left; max-height: 400px; overflow-y: auto; border-top: 1px solid #e2e8f0; padding-top: 16px; }
        .result-item { padding: 10px 0; border-bottom: 1px solid #e9edf2; font-size: 14px; }
        .result-item .justif { font-size: 13px; background: #f1f5f9; padding: 4px 10px; border-radius: 8px; margin-top: 4px; display: inline-block; }
        .result-item .mnemo { font-size: 13px; background: #fef7e0; padding: 4px 10px; border-radius: 8px; margin-top: 4px; display: inline-block; border: 1px solid #f7d97a; }
        .hidden { display: none !important; }
        @media (max-width: 480px) { .container { padding: 18px 14px 22px; } .question-text { font-size: 18px; } .option { font-size: 15px; padding: 14px 16px; } .btn { font-size: 15px; padding: 12px 10px; min-width: 80px; } .header h1 { font-size: 19px; } }
    </style>
</head>
<body>
<div class="container" id="app">
    <div class="header">
        <h1>📰 Actualitat 2026 <small>30 preguntes</small></h1>
        <span class="progress-badge" id="progressLabel">1 / 30</span>
    </div>
    <div id="questionArea">
        <div class="question-number"><span id="qNumber">Pregunta 1</span><span id="questionStatus"></span></div>
        <div class="question-text" id="qText">Carregant...</div>
        <div class="options" id="optionsContainer"></div>
        <div class="feedback" id="feedback">
            <div><span class="badge" id="badgeResult">✅ Correcte</span></div>

            <button class="btn btn-success" id="resetBtn">🔄 Tornar a començar</button>

</div>
<script>
const PREGUNTES = [
{id:1, pregunta:"En quin territori espanyol s'ha produït durant l'estiu de 2026 una important crisi migratòria arran de l'entrada massiva de persones procedents del Marroc?", opcions:["Melilla","Ceuta","Illes Canàries"], correcta:1, justificacio:"Ceuta ha viscut una important crisi migratòria durant l'estiu de 2026, amb entrada massiva de persones del Marroc.", mnemo:"Ceuta → crisi migratòria, com 'C'."},
{id:2, pregunta:"Ceuta és una ciutat autònoma espanyola situada al continent...", opcions:["africà","asiàtic","europeu"], correcta:0, justificacio:"Ceuta és territori espanyol al nord d'Àfrica.", mnemo:"Ceuta → Àfrica, com 'C'."},
{id:3, pregunta:"Quin país es troba al costat de Ceuta i és el principal punt d'origen de les persones que han intentat entrar massivament a la ciutat el 2026?", opcions:["Algèria","Tunísia","Marroc"], correcta:2, justificacio:"Ceuta limita per terra amb el Marroc, d'on provenen els migrants.", mnemo:"Marroc → frontera amb Ceuta, com 'M'."},
{id:4, pregunta:"Quin ministre del Govern espanyol és responsable del Ministeri de l'Interior?", opcions:["Fernando Grande-Marlaska","Ángel Víctor Torres","Félix Bolaños"], correcta:0, justificacio:"Fernando Grande-Marlaska és el ministre de l'Interior.", mnemo:"Grande-Marlaska → Interior, com 'G'."},
{id:5, pregunta:"Quin és el nom del president de la Ciutat Autònoma de Ceuta?", opcions:["Juan Jesús Vivas","Juanma Moreno","José Luis Martínez-Almeida"], correcta:0, justificacio:"Juan Jesús Vivas és el president de Ceuta.", mnemo:"Vivas → Ceuta, com 'V'."},
{id:6, pregunta:"A finals d'agost de 2026, una catàstrofe natural va afectar la zona fronterera entre el Nepal i el Tibet. Quin fenomen va provocar la gran riuada?", opcions:["El col·lapse d'una glacera","L'erupció d'un volcà","Un tsunami"], correcta:0, justificacio:"El col·lapse d'una glacera a l'Himàlaia va desencadenar la riuada.", mnemo:"Glacera → Nepal/Tibet, com 'G'."},
{id:7, pregunta:"Quin riu va quedar especialment afectat per la gran riuada a la frontera entre el Nepal i el Tibet?", opcions:["Ganges","Lhende Khola","Mekong"], correcta:1, justificacio:"La riuada va afectar especialment el riu Lhende Khola.", mnemo:"Lhende Khola → riuada, com 'L'."},
{id:8, pregunta:"El Tibet forma part actualment de quin país?", opcions:["Índia","Nepal","Xina"], correcta:2, justificacio:"El Tibet és una regió autònoma de la Xina.", mnemo:"Tibet → Xina, com 'X'."},
{id:9, pregunta:"Quina és la capital del Nepal?", opcions:["Katmandú","Thimphu","Dhaka"], correcta:0, justificacio:"Katmandú és la capital del Nepal.", mnemo:"Katmandú → Nepal, com 'K'."},
{id:10, pregunta:"Quin sistema muntanyós és l'escenari de la catàstrofe provocada pel col·lapse glacial entre el Nepal i el Tibet?", opcions:["Alps","Himàlaia","Andes"], correcta:1, justificacio:"El Nepal i el Tibet es troben a la regió de l'Himàlaia.", mnemo:"Himàlaia → Nepal/Tibet, com 'H'."},
{id:11, pregunta:"Inicialment, el fenomen que va provocar la gran riuada entre el Nepal i el Tibet es va arribar a confondre amb...", opcions:["un terratrèmol","un tsunami","una erupció volcànica"], correcta:0, justificacio:"Les primeres informacions van confondre el fenomen amb un terratrèmol.", mnemo:"Terratrèmol → confusió inicial, com 'T'."},
{id:12, pregunta:"Quin factor relacionat amb el canvi climàtic pot contribuir a augmentar la inestabilitat de les glaceres?", opcions:["L'augment de les temperatures","La disminució de la radiació solar","L'augment de la salinitat dels oceans"], correcta:0, justificacio:"L'augment de temperatures afavoreix el retrocés i la inestabilitat de les glaceres.", mnemo:"Temperatures → glaceres, com 'T'."},
{id:13, pregunta:"A mitjan agost de 2026, quina ciutat espanyola va patir diversos terratrèmols que van provocar danys en edificis?", opcions:["Granada","Salamanca","Vigo"], correcta:0, justificacio:"Granada va patir diversos terratrèmols a l'agost de 2026.", mnemo:"Granada → terratrèmols, com 'G'."},
{id:14, pregunta:"Quin organisme espanyol és responsable de la vigilància i informació oficial sobre l'activitat sísmica?", opcions:["AEMET","IGN","INE"], correcta:1, justificacio:"L'Institut Geogràfic Nacional (IGN) és l'organisme de referència per a la informació sísmica.", mnemo:"IGN → sismes, com 'I'."},
{id:15, pregunta:"Quina magnitud aproximada va assolir el terratrèmol que va afectar l'àrea de Granada el 15 d'agost de 2026?", opcions:["2,0","5,0","8,5"], correcta:1, justificacio:"El 15 d'agost es va registrar un terratrèmol de magnitud 5 a Granada.", mnemo:"5,0 → Granada, com '5'."},
{id:16, pregunta:"Quina ciutat espanyola va veure restringit temporalment l'accés a l'Alhambra arran de la sèrie de terratrèmols de l'agost de 2026?", opcions:["Còrdova","Sevilla","Granada"], correcta:2, justificacio:"L'activitat sísmica va provocar restriccions a l'Alhambra de Granada.", mnemo:"Granada → Alhambra, com 'G'."},
{id:17, pregunta:"Quin conflicte bèl·lic continua afectant Ucraïna el 2026?", opcions:["El conflicte amb Rússia","El conflicte amb Polònia","El conflicte amb Romania"], correcta:0, justificacio:"La guerra entre Rússia i Ucraïna continua el 2026.", mnemo:"Rússia → Ucraïna, com 'R'."},
{id:18, pregunta:"Qui és actualment el president d'Ucraïna?", opcions:["Vladímir Putin","Volodímir Zelenski","Donald Trump"], correcta:1, justificacio:"Volodímir Zelenski és el president d'Ucraïna.", mnemo:"Zelenski → Ucraïna, com 'Z'."},
{id:19, pregunta:"Qui és el president de Rússia?", opcions:["Vladímir Putin","Dmitri Medvédev","Mikhail Mishustin"], correcta:0, justificacio:"Vladímir Putin és el president de Rússia.", mnemo:"Putin → Rússia, com 'P'."},
{id:20, pregunta:"Quin organisme internacional agrupa actualment 32 països membres i té un paper central en la cooperació militar occidental?", opcions:["OTAN","OPEP","Mercosur"], correcta:0, justificacio:"L'OTAN és l'aliança militar amb 32 estats membres.", mnemo:"OTAN → 32 membres, com 'O'."},
{id:21, pregunta:"Quin conflicte continua sent un dels principals focus d'actualitat internacional a l'Orient Mitjà el 2026?", opcions:["El conflicte entre Israel i Hamas a Gaza","El conflicte entre Egipte i Líbia","El conflicte entre Jordània i Turquia"], correcta:0, justificacio:"El conflicte entre Israel i Hamas a Gaza continua sent un focus d'actualitat.", mnemo:"Israel/Hamas → Gaza, com 'G'."},
{id:22, pregunta:"Quin país va assumir el paper de mediador principal en diversos esforços diplomàtics relacionats amb Gaza durant l'actual administració de Donald Trump?", opcions:["Estats Units","Canadà","Austràlia"], correcta:0, justificacio:"Els Estats Units han impulsat esforços diplomàtics a Gaza.", mnemo:"EUA → mediador, com 'E'."},
{id:23, pregunta:"Qui és el president dels Estats Units d'Amèrica el 2026?", opcions:["Joe Biden","Donald Trump","Barack Obama"], correcta:1, justificacio:"Donald Trump és el president dels EUA el 2026.", mnemo:"Trump → 2026, com 'T'."},
{id:24, pregunta:"Quin és actualment el president de la Generalitat de Catalunya?", opcions:["Pere Aragonès","Salvador Illa","Carles Puigdemont"], correcta:1, justificacio:"Salvador Illa és el president de la Generalitat.", mnemo:"Illa → Generalitat, com 'I'."},
{id:25, pregunta:"Qui és actualment el conseller d'Interior i Seguretat Pública de la Generalitat de Catalunya?", opcions:["Núria Parlon","Alicia Romero","Sílvia Paneque"], correcta:0, justificacio:"Núria Parlon és la consellera d'Interior.", mnemo:"Parlon → Interior, com 'P'."},
{id:26, pregunta:"Quin fenomen meteorològic va provocar les greus inundacions de la Comunitat Valenciana l'octubre de 2024?", opcions:["DANA","Tornado","Monzó"], correcta:0, justificacio:"Una DANA va provocar les inundacions de la Comunitat Valenciana el 2024.", mnemo:"DANA → inundacions, com 'D'."},
{id:27, pregunta:"Quin país sud-americà va patir un important terratrèmol d'una magnitud aproximada de 7,4 durant l'agost de 2026?", opcions:["Colòmbia","Uruguai","Paraguai"], correcta:0, justificacio:"Colòmbia va patir un terratrèmol de magnitud 7,4 a l'agost de 2026.", mnemo:"Colòmbia → terratrèmol, com 'C'."},
{id:28, pregunta:"Quin país va ser escenari durant el 2026 de diversos terratrèmols de gran magnitud juntament amb Colòmbia i Mèxic?", opcions:["Indonèsia","Portugal","Suïssa"], correcta:0, justificacio:"Indonèsia també ha patit terratrèmols de magnitud 7 o superior el 2026.", mnemo:"Indonèsia → terratrèmols, com 'I'."},
{id:29, pregunta:"Quin és el nom de l'organització internacional que ha participat en les tasques d'ajuda i coordinació davant catàstrofes humanitàries com la del Nepal?", opcions:["ONU","UEFA","OCDE"], correcta:0, justificacio:"L'ONU intervé en nombroses emergències humanitàries internacionals.", mnemo:"ONU → ajuda humanitària, com 'O'."},
{id:30, pregunta:"Quina afirmació és CORRECTA sobre la gran catàstrofe del Nepal i el Tibet de l'agost de 2026?", opcions:["Va ser provocada per un tsunami","Va estar relacionada amb el col·lapse d'una glacera que va desencadenar una gran riuada","Va ser causada per l'erupció d'un volcà"], correcta:1, justificacio:"La catàstrofe va estar vinculada al col·lapse glacial i a la posterior riuada sobtada.", mnemo:"Glacera + riuada → catàstrofe, com 'G'."}
];
// Lògica del test (idèntica a l'anterior)
let answers=new Array(PREGUNTES.length).fill(null), revealed=new Array(PREGUNTES.length).fill(false), currentIndex=0, mode='normal', wrongIndices=[];
const $=id=>document.getElementById(id), questionArea=$('questionArea'), resultArea=$('resultArea'), progressLabel=$('progressLabel'), qNumber=$('qNumber'), questionStatus=$('questionStatus'), qText=$('qText'), optionsContainer=$('optionsContainer'), feedback=$('feedback'), badgeResult=$('badgeResult'), justificationText=$('justificationText'), mnemonicText=$('mnemonicText'), checkBtn=$('checkBtn'), nextBtn=$('nextBtn'), prevBtn=$('prevBtn'), resetBtn=$('resetBtn'), retryWrongBtn=$('retryWrongBtn'), finalScore=$('finalScore'), finalMessage=$('finalMessage'), resultDetail=$('resultDetail');
function getCurrentQuestions(){if(mode==='retry'&&wrongIndices.length>0)return wrongIndices.map(i=>PREGUNTES[i]);return PREGUNTES;}
function getCurrentAnswers(){if(mode==='retry'&&wrongIndices.length>0)return wrongIndices.map(i=>answers[i]);return answers;}
function getCurrentRevealed(){if(mode==='retry'&&wrongIndices.length>0)return wrongIndices.map(i=>revealed[i]);return revealed;}
function renderQuestion(index){const qs=getCurrentQuestions(), ans=getCurrentAnswers(), rev=getCurrentRevealed();if(index>=qs.length){showResults();return;}const q=qs[index], userAnswer=ans[index], isRevealed=rev[index], total=qs.length;progressLabel.textContent=index+1+' / '+total;qNumber.innerHTML='<span>Pregunta '+(index+1)+'</span><span id="questionStatus"></span>';if(isRevealed){const isCorrect=userAnswer===q.correcta;document.getElementById('questionStatus').textContent=isCorrect?'✅':'❌';}else{document.getElementById('questionStatus').textContent='';}qText.textContent=q.pregunta;optionsContainer.innerHTML='';const letters=['a','b','c'];q.opcions.forEach((text,i)=>{const div=document.createElement('div');div.className='option';if(userAnswer===i)div.classList.add('selected');if(isRevealed){div.classList.add('disabled');if(i===q.correcta)div.classList.add('correct');if(userAnswer===i&&i!==q.correcta)div.classList.add('wrong');}div.innerHTML='<span class="letter">'+letters[i]+'</span> '+text;div.dataset.index=i;if(!isRevealed){const handler=()=>selectOption(index,i);div.addEventListener('click',handler);div.addEventListener('touchstart',(e)=>{if(!e.target.closest('.option.disabled'))handler();},{passive:true});}optionsContainer.appendChild(div);});if(isRevealed){const isCorrect=userAnswer===q.correcta;badgeResult.textContent=isCorrect?'✅ Correcte':'❌ Incorrecte';badgeResult.className='badge '+(isCorrect?'correct-badge':'wrong-badge');justificationText.textContent=q.justificacio;mnemonicText.innerHTML='<strong>🧠 Truc:</strong> '+q.mnemo;feedback.classList.add('show');checkBtn.style.display='none';nextBtn.style.display='inline-block';}else{feedback.classList.remove('show');checkBtn.style.display='inline-block';nextBtn.style.display='none';}nextBtn.disabled=(index===total-1&&!isRevealed);prevBtn.disabled=(index===0);if(index===total-1&&isRevealed){nextBtn.textContent='📊 Resultat';nextBtn.onclick=showResults;}else{nextBtn.textContent='Següent →';nextBtn.onclick=()=>goTo(index+1);}}
function selectOption(qIndex,optIndex){if(getCurrentRevealed()[qIndex])return;const ans=getCurrentAnswers();ans[qIndex]=optIndex;if(mode==='retry'&&wrongIndices.length>0){const originalIdx=wrongIndices[qIndex];answers[originalIdx]=optIndex;}renderQuestion(currentIndex);}
function checkAnswer(){const qs=getCurrentQuestions(), ans=getCurrentAnswers(), rev=getCurrentRevealed(), idx=currentIndex;if(ans[idx]===null){alert('Selecciona una opció abans de comprovar.');return;}rev[idx]=true;if(mode==='retry'&&wrongIndices.length>0){const originalIdx=wrongIndices[idx];revealed[originalIdx]=true;}renderQuestion(currentIndex);}
function goTo(index){const qs=getCurrentQuestions();if(index<0||index>=qs.length)return;currentIndex=index;renderQuestion(index);window.scrollTo({top:0,behavior:'auto'});}
function showResults(){const total=PREGUNTES.length;let correctCount=0,wrongCount=0,unanswered=0,detall=[];for(let i=0;i<total;i++){const q=PREGUNTES[i], userAns=answers[i], isRevealed=revealed[i], isCorrect=userAns===q.correcta;if(!isRevealed){unanswered++;detall.push({index:i,q,userAns,isCorrect:false,status:'no respondida'});}else if(isCorrect){correctCount++;detall.push({index:i,q,userAns,isCorrect:true,status:'correcta'});}else{wrongCount++;detall.push({index:i,q,userAns,isCorrect:false,status:'fallada'});}}const percent=Math.round((correctCount/total)*100);finalScore.textContent=correctCount;let msg='';if(correctCount===total)msg='🏆 Perfecte! Estàs al dia!';else if(correctCount>=total*0.8)msg='🌟 Molt bé!';else if(correctCount>=total*0.6)msg='👍 Bé, repassa les fallades.';else if(correctCount>=total*0.4)msg='📚 Necessites seguir l\'actualitat.';else msg='💪 Torna a intentar-ho.';finalMessage.textContent=msg;let html='<div style="font-weight:600;margin-bottom:8px;">📋 Detall</div>';detall.forEach((item,idx)=>{const q=item.q,userLletra=item.userAns!==null?String.fromCharCode(65+item.userAns):'—',correctLletra=String.fromCharCode(65+q.correcta);let icon='',color='';if(item.status==='correcta'){icon='✅';color='#1e7e34';}else if(item.status==='fallada'){icon='❌';color='#b91c1c';}else{icon='⏭️';color='#64748b';}html+='<div class="result-item"><span style="color:'+color+';font-weight:600;">'+icon+' '+(idx+1)+'.</span> <strong>'+q.pregunta+'</strong><br><span style="font-size:13px;">Tria: '+userLletra+' | Correcta: '+correctLletra+'</span><br><span class="justif">💡 '+q.justificacio+'</span>'+(q.mnemo?'<br><span class="mnemo">🧠 '+q.mnemo+'</span>':'')+'</div>';});resultDetail.innerHTML=html;questionArea.classList.add('hidden');resultArea.classList.remove('hidden');const fallades=detall.filter(d=>d.status==='fallada').map(d=>d.index);if(fallades.length>0){retryWrongBtn.style.display='inline-block';retryWrongBtn.onclick=()=>startRetry(fallades);}else{retryWrongBtn.style.display='none';}}
function startRetry(falladesIndices){if(falladesIndices.length===0)return;for(let idx of falladesIndices){answers[idx]=null;revealed[idx]=false;}mode='retry';wrongIndices=falladesIndices;currentIndex=0;resultArea.classList.add('hidden');questionArea.classList.remove('hidden');renderQuestion(0);window.scrollTo({top:0,behavior:'auto'});}
function resetTest(){mode='normal';wrongIndices=[];currentIndex=0;answers=new Array(PREGUNTES.length).fill(null);revealed=new Array(PREGUNTES.length).fill(false);resultArea.classList.add('hidden');questionArea.classList.remove('hidden');renderQuestion(0);window.scrollTo({top:0,behavior:'auto'});}
checkBtn.addEventListener('click',checkAnswer);checkBtn.addEventListener('touchstart',(e)=>{if(!e.target.disabled)checkAnswer();},{passive:true});prevBtn.addEventListener('click',()=>goTo(currentIndex-1));prevBtn.addEventListener('touchstart',(e)=>{if(!e.target.disabled)goTo(currentIndex-1);},{passive:true});resetBtn.addEventListener('click',resetTest);resetBtn.addEventListener('touchstart',resetTest,{passive:true});renderQuestion(0);
