<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Test Trampes · Cultura General</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
            background: #e9edf2;
            padding: 16px 12px 40px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #1e293b;
        }
        .container {
            max-width: 680px;
            width: 100%;
            background: #fff;
            border-radius: 32px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.08);
            padding: 24px 20px 30px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eef2f6;
            padding-bottom: 14px;
            margin-bottom: 22px;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #0b2b4a;
        }
        .header h1 small {
            font-size: 14px;
            font-weight: 400;
            color: #64748b;
            margin-left: 8px;
        }
        .progress-badge {
            background: #dbe7f3;
            color: #0b2b4a;
            font-weight: 600;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 15px;
            white-space: nowrap;
        }
        .question-number {
            font-weight: 700;
            color: #1a4b7a;
            font-size: 15px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .question-text {
            font-size: 20px;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 24px;
            min-height: 3.2em;
            color: #0a1e32;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 28px;
        }
        .option {
            background: #f8fafc;
            border: 2px solid #dce2ea;
            border-radius: 16px;
            padding: 16px 20px;
            font-size: 17px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 14px;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            transition: 0.15s;
        }
        .option:active { transform: scale(0.98); }
        .option .letter {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #dce2ea;
            color: #1e293b;
            font-weight: 700;
            font-size: 16px;
            flex-shrink: 0;
        }
        .option.selected { border-color: #1a4b7a; background: #e6eff9; }
        .option.selected .letter { background: #1a4b7a; color: white; }
        .option.correct { border-color: #1e7e34; background: #e6f5ea; }
        .option.correct .letter { background: #1e7e34; color: white; }
        .option.wrong { border-color: #b91c1c; background: #fde8e8; }
        .option.wrong .letter { background: #b91c1c; color: white; }
        .option.disabled { pointer-events: none; opacity: 0.9; }
        .option.disabled:active { transform: none; }

        .feedback {
            background: #f1f5f9;
            border-radius: 18px;
            padding: 18px 20px;
            margin: 4px 0 24px;
            display: none;
            border-left: 6px solid #94a3b8;
        }
        .feedback.show { display: block; }
        .feedback .badge {
            display: inline-block;
            font-weight: 700;
            font-size: 15px;
            padding: 4px 18px;
            border-radius: 30px;
            margin-bottom: 10px;
        }
        .badge.correct-badge { background: #d1f0d9; color: #0f5424; }
        .badge.wrong-badge { background: #fcd5d5; color: #8b1a1a; }
        .feedback .justification { font-size: 16px; line-height: 1.5; margin: 8px 0; }
        .feedback .mnemonic {
            background: #fef7e0;
            border-radius: 14px;
            padding: 12px 16px;
            margin-top: 14px;
            font-size: 15px;
            border: 1px solid #f7d97a;
            color: #7a5800;
        }
        .feedback .mnemonic strong { font-weight: 700; color: #5f4300; }

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 4px;
        }
        .btn {
            flex: 1;
            min-width: 100px;
            background: #eef2f6;
            border: none;
            border-radius: 40px;
            padding: 14px 18px;
            font-weight: 600;
            font-size: 17px;
            color: #1e293b;
            cursor: pointer;
            transition: 0.15s;
            text-align: center;
            touch-action: manipulation;
        }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background: #1a4b7a; color: white; box-shadow: 0 4px 12px rgba(26,75,122,0.25); }
        .btn-primary:disabled { opacity: 0.5; pointer-events: none; box-shadow: none; }
        .btn-secondary { background: #e2e8f0; }
        .btn-success { background: #1e7e34; color: white; box-shadow: 0 4px 12px rgba(30,126,52,0.25); }
        .btn-warning { background: #d97706; color: white; box-shadow: 0 4px 12px rgba(217,119,6,0.25); }

        .result-box { text-align: center; padding: 20px 0 10px; }
        .result-box .score { font-size: 60px; font-weight: 800; color: #0b2b4a; }
        .result-box .label { font-size: 20px; color: #475569; margin-top: 4px; }
        .result-box .message { margin-top: 16px; font-size: 18px; font-weight: 500; }
        .result-detail {
            margin-top: 20px;
            text-align: left;
            max-height: 400px;
            overflow-y: auto;
            border-top: 1px solid #e2e8f0;
            padding-top: 16px;
        }
        .result-item {
            padding: 10px 0;
            border-bottom: 1px solid #e9edf2;
            font-size: 14px;
        }
        .result-item .justif {
            font-size: 13px;
            background: #f1f5f9;
            padding: 4px 10px;
            border-radius: 8px;
            margin-top: 4px;
            display: inline-block;
        }
        .result-item .mnemo {
            font-size: 13px;
            background: #fef7e0;
            padding: 4px 10px;
            border-radius: 8px;
            margin-top: 4px;
            display: inline-block;
            border: 1px solid #f7d97a;
        }
        .hidden { display: none !important; }

        @media (max-width: 480px) {
            .container { padding: 18px 14px 22px; }
            .question-text { font-size: 18px; }
            .option { font-size: 15px; padding: 14px 16px; }
            .btn { font-size: 15px; padding: 12px 10px; min-width: 80px; }
            .header h1 { font-size: 19px; }
        }
    </style>
</head>
<body>
<div class="container" id="app">
    <div class="header">
        <h1>🧩 Test Trampes <small>cultura general</small></h1>
        <span class="progress-badge" id="progressLabel">1 / 17</span>
    </div>

    <div id="questionArea">
        <div class="question-number">
            <span id="qNumber">Pregunta 1</span>
            <span id="questionStatus"></span>
        </div>
        <div class="question-text" id="qText">Carregant...</div>
        <div class="options" id="optionsContainer"></div>
        <div class="feedback" id="feedback">
            <div><span class="badge" id="badgeResult">✅ Correcte</span></div>
            <div class="justification" id="justificationText"></div>
            <div class="mnemonic" id="mnemonicText"><strong>🧠 Truc per recordar:</strong> </div>
        </div>
        <div class="actions">
            <button class="btn btn-secondary" id="prevBtn" disabled>← Anterior</button>
            <button class="btn btn-primary" id="checkBtn">Comprovar</button>
            <button class="btn btn-primary" id="nextBtn" style="display:none;">Següent →</button>
        </div>
    </div>

    <div id="resultArea" class="result-box hidden">
        <div class="score" id="finalScore">0</div>
        <div class="label">encerts de 17</div>
        <div class="message" id="finalMessage">😊 Bon treball!</div>
        <div style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:16px;">
            <button class="btn btn-success" id="resetBtn">🔄 Tornar a començar</button>
            <button class="btn btn-warning" id="retryWrongBtn" style="display:none;">📝 Repetir fallades</button>
        </div>
        <div class="result-detail" id="resultDetail"></div>
    </div>
</div>

<script>
// ============================================================
//  PREGUNTES DEL TEST DE TRAMPES (extretes del PDF)
// ============================================================
const PREGUNTES = [
    {
        id: 10,
        pregunta: "Quin és el continent amb més països?",
        opcions: ["Àfrica", "Europa", "Àsia", "Amèrica"],
        correcta: 0,
        justificacio: "Àfrica és el continent amb més estats sobirans, habitualment 54 països.",
        mnemo: "Àfrica → més països, com si tingués un 'país' per cada dia de l'any (54)."
    },
    {
        id: 11,
        pregunta: "Quin és el país més petit del món?",
        opcions: ["Mònaco", "Vaticà", "San Marino", "Liechtenstein"],
        correcta: 1,
        justificacio: "La Ciutat del Vaticà té aproximadament 0,49 km² i és el país més petit del món.",
        mnemo: "Vaticà → el més petit, com una 'vaca' en miniatura."
    },
    {
        id: 12,
        pregunta: "Quin és el país més poblat d'Europa si considerem Rússia com a país europeu transcontinental?",
        opcions: ["Alemanya", "França", "Rússia", "Regne Unit"],
        correcta: 2,
        justificacio: "Rússia té uns 144 milions d'habitants en el conjunt del país, per davant d'Alemanya.",
        mnemo: "Rússia → el més poblat, com si 'russos' omplissin tot Europa."
    },
    {
        id: 13,
        pregunta: "Quin és el desert més gran del món?",
        opcions: ["Sàhara", "Antàrtida", "Aràbia", "Gobi"],
        correcta: 1,
        justificacio: "L'Antàrtida és un desert polar i és el desert més extens del planeta.",
        mnemo: "Antàrtida → el desert més gran, encara que sigui gelat."
    },
    {
        id: 14,
        pregunta: "Quin és el desert càlid més gran del món?",
        opcions: ["Sàhara", "Antàrtida", "Aràbia", "Kalahari"],
        correcta: 0,
        justificacio: "El Sàhara és el desert càlid més gran, amb uns 9 milions de km².",
        mnemo: "Sàhara → el més càlid, com una 'sabana' en flames."
    },
    {
        id: 15,
        pregunta: "Quin és el llac més gran del món per superfície?",
        opcions: ["Mar Caspi", "Llac Baikal", "Llac Superior", "Llac Victoria"],
        correcta: 0,
        justificacio: "El Mar Caspi, amb 371.000 km², és el llac més gran per superfície, tot i que s'anomeni 'mar'.",
        mnemo: "Mar Caspi → el llac més gran, però es fa dir 'mar' per fer-se el important."
    },
    {
        id: 16,
        pregunta: "Quin és el llac més profund del món?",
        opcions: ["Mar Caspi", "Llac Baikal", "Llac Titicaca", "Llac Superior"],
        correcta: 1,
        justificacio: "El Baikal, a Rússia, arriba a uns 1.642 metres de profunditat.",
        mnemo: "Baikal → el més profund, com si 'baixés' molt."
    },
    {
        id: 17,
        pregunta: "Quin és el país més gran del món per superfície?",
        opcions: ["Canadà", "Xina", "Estats Units", "Rússia"],
        correcta: 3,
        justificacio: "Rússia té 17,1 milions de km² i és el país més extens del planeta.",
        mnemo: "Rússia → el més gran, com si 'russos' ocupessin tot el mapa."
    },
    {
        id: 18,
        pregunta: "Quin és el país més poblat d'Amèrica del Sud?",
        opcions: ["Colòmbia", "Argentina", "Brasil", "Perú"],
        correcta: 2,
        justificacio: "Brasil té més de 200 milions d'habitants, molt per davant dels altres.",
        mnemo: "Brasil → el més poblat, com si 'brazilians' omplissin tot el continent."
    },
    {
        id: 19,
        pregunta: "Quin és el cim més alt d'Espanya?",
        opcions: ["Mulhacén", "Teide", "Aneto", "Almanzor"],
        correcta: 1,
        justificacio: "El Teide, a Tenerife, té 3.715 m i és el punt més alt d'Espanya.",
        mnemo: "Teide → el més alt d'Espanya, però no de la península."
    },
    {
        id: 20,
        pregunta: "Quin és el punt més alt de la península Ibèrica?",
        opcions: ["Teide", "Mulhacén", "Aneto", "Almanzor"],
        correcta: 1,
        justificacio: "El Mulhacén, a Sierra Nevada, té 3.479 m i és el més alt de la península.",
        mnemo: "Mulhacén → el més alt de la península, com un 'mulat' que s'enlaira."
    },
    // ---- TRAMPES DESTACADES AL FINAL DEL PDF ----
    {
        id: 101,
        pregunta: "Quin és el país més poblat del món?",
        opcions: ["Xina", "Índia", "Estats Units", "Indonèsia"],
        correcta: 1,
        justificacio: "L'Índia és actualment el país més poblat, superant la Xina.",
        mnemo: "Índia → ara és la primera, abans era la Xina (recorda el canvi)."
    },
    {
        id: 102,
        pregunta: "Quin és el país més gran d'Europa? (considerant Rússia transcontinental)",
        opcions: ["Rússia", "Ucraïna", "França", "Espanya"],
        correcta: 0,
        justificacio: "Rússia és el país més gran d'Europa, encara que part del seu territori sigui asiàtic.",
        mnemo: "Rússia → el més gran d'Europa, però es 'col·loca' a Àsia també."
    },
    {
        id: 103,
        pregunta: "Quina és la muntanya més alta d'Europa?",
        opcions: ["Mont Blanc", "Elbrús", "Matterhorn", "Kilimanjaro"],
        correcta: 1,
        justificacio: "L'Elbrús, al Caucas, és la muntanya més alta d'Europa (5.642 m).",
        mnemo: "Elbrús → el més alt, si no comptes el Mont Blanc (que és el més alt dels Alps)."
    },
    {
        id: 104,
        pregunta: "Quin és el desert més gran del món? (recorda la trampa)",
        opcions: ["Sàhara", "Antàrtida", "Aràbia", "Gobi"],
        correcta: 1,
        justificacio: "L'Antàrtida és el desert més gran; el Sàhara és el càlid més gran.",
        mnemo: "Antàrtida → el desert més gran, el Sàhara és el càlid més gran."
    },
    {
        id: 105,
        pregunta: "Quin és el llac més gran del món per superfície? (recorda la trampa)",
        opcions: ["Mar Caspi", "Baikal", "Superior", "Victoria"],
        correcta: 0,
        justificacio: "El Mar Caspi és el llac més gran, tot i que es digui 'mar'.",
        mnemo: "Mar Caspi → 'mar' però és un llac, com un 'mar' de mentida."
    },
    {
        id: 106,
        pregunta: "Quin és el cim més alt d'Espanya? (recorda la trampa)",
        opcions: ["Teide", "Mulhacén", "Aneto", "Almanzor"],
        correcta: 0,
        justificacio: "El Teide (3.715 m) és el més alt d'Espanya; el Mulhacén és el més alt de la península.",
        mnemo: "Teide → el més alt d'Espanya, però el Mulhacén és el més alt de la península."
    }
];

// ============================================================
//  ESTAT I LÒGICA (mateix que el test de premis, adaptat)
// ============================================================
let answers = new Array(PREGUNTES.length).fill(null);
let revealed = new Array(PREGUNTES.length).fill(false);
let currentIndex = 0;
let mode = 'normal'; // 'normal' | 'retry'
let wrongIndices = [];

const $ = id => document.getElementById(id);
const questionArea = $('questionArea');
const resultArea = $('resultArea');
const progressLabel = $('progressLabel');
const qNumber = $('qNumber');
const questionStatus = $('questionStatus');
const qText = $('qText');
const optionsContainer = $('optionsContainer');
const feedback = $('feedback');
const badgeResult = $('badgeResult');
const justificationText = $('justificationText');
const mnemonicText = $('mnemonicText');
const checkBtn = $('checkBtn');
const nextBtn = $('nextBtn');
const prevBtn = $('prevBtn');
const resetBtn = $('resetBtn');
const retryWrongBtn = $('retryWrongBtn');
const finalScore = $('finalScore');
const finalMessage = $('finalMessage');
const resultDetail = $('resultDetail');

function getCurrentQuestions() {
    if (mode === 'retry' && wrongIndices.length > 0) return wrongIndices.map(i => PREGUNTES[i]);
    return PREGUNTES;
}
function getCurrentAnswers() {
    if (mode === 'retry' && wrongIndices.length > 0) return wrongIndices.map(i => answers[i]);
    return answers;
}
function getCurrentRevealed() {
    if (mode === 'retry' && wrongIndices.length > 0) return wrongIndices.map(i => revealed[i]);
    return revealed;
}

function renderQuestion(index) {
    const qs = getCurrentQuestions();
    const ans = getCurrentAnswers();
    const rev = getCurrentRevealed();

    if (index >= qs.length) { showResults(); return; }

    const q = qs[index];
    const userAnswer = ans[index];
    const isRevealed = rev[index];
    const total = qs.length;

    progressLabel.textContent = `${index+1} / ${total}`;
    qNumber.innerHTML = `<span>Pregunta ${index+1}</span><span id="questionStatus"></span>`;
    if (isRevealed) {
        const isCorrect = userAnswer === q.correcta;
        document.getElementById('questionStatus').textContent = isCorrect ? '✅' : '❌';
    } else {
        document.getElementById('questionStatus').textContent = '';
    }
    qText.textContent = q.pregunta;

    optionsContainer.innerHTML = '';
    const letters = ['a','b','c','d'];
    q.opcions.forEach((text, i) => {
        const div = document.createElement('div');
        div.className = 'option';
        if (userAnswer === i) div.classList.add('selected');
        if (isRevealed) {
            div.classList.add('disabled');
            if (i === q.correcta) div.classList.add('correct');
            if (userAnswer === i && i !== q.correcta) div.classList.add('wrong');
        }
        div.innerHTML = `<span class="letter">${letters[i]}</span> ${text}`;
        div.dataset.index = i;
        if (!isRevealed) {
            const handler = () => selectOption(index, i);
            div.addEventListener('click', handler);
            div.addEventListener('touchstart', (e) => { if (!e.target.closest('.option.disabled')) handler(); }, { passive: true });
        }
        optionsContainer.appendChild(div);
    });

    if (isRevealed) {
        const isCorrect = userAnswer === q.correcta;
        badgeResult.textContent = isCorrect ? '✅ Correcte' : '❌ Incorrecte';
        badgeResult.className = `badge ${isCorrect ? 'correct-badge' : 'wrong-badge'}`;
        justificationText.textContent = q.justificacio;
        mnemonicText.innerHTML = `<strong>🧠 Truc per recordar:</strong> ${q.mnemo}`;
        feedback.classList.add('show');
        checkBtn.style.display = 'none';
        nextBtn.style.display = 'inline-block';
    } else {
        feedback.classList.remove('show');
        checkBtn.style.display = 'inline-block';
        nextBtn.style.display = 'none';
    }

    nextBtn.disabled = (index === total - 1 && !isRevealed);
    prevBtn.disabled = (index === 0);

    if (index === total - 1 && isRevealed) {
        nextBtn.textContent = '📊 Resultat';
        nextBtn.onclick = showResults;
    } else {
        nextBtn.textContent = 'Següent →';
        nextBtn.onclick = () => goTo(index + 1);
    }
}

function selectOption(qIndex, optIndex) {
    if (getCurrentRevealed()[qIndex]) return;
    const ans = getCurrentAnswers();
    ans[qIndex] = optIndex;
    if (mode === 'retry' && wrongIndices.length > 0) {
        const originalIdx = wrongIndices[qIndex];
        answers[originalIdx] = optIndex;
    }
    renderQuestion(currentIndex);
}

function checkAnswer() {
    const qs = getCurrentQuestions();
    const ans = getCurrentAnswers();
    const rev = getCurrentRevealed();
    const idx = currentIndex;

    if (ans[idx] === null) { alert('Selecciona una opció abans de comprovar.'); return; }

    rev[idx] = true;
    if (mode === 'retry' && wrongIndices.length > 0) {
        const originalIdx = wrongIndices[idx];
        revealed[originalIdx] = true;
    }
    renderQuestion(currentIndex);
}

function goTo(index) {
    const qs = getCurrentQuestions();
    if (index < 0 || index >= qs.length) return;
    currentIndex = index;
    renderQuestion(index);
    window.scrollTo({ top: 0, behavior: 'auto' });
}

function showResults() {
    const total = PREGUNTES.length;
    let correctCount = 0, wrongCount = 0, unanswered = 0;
    const detall = [];

    for (let i = 0; i < total; i++) {
        const q = PREGUNTES[i];
        const userAns = answers[i];
        const isRevealed = revealed[i];
        const isCorrect = userAns === q.correcta;

        if (!isRevealed) {
            unanswered++;
            detall.push({ index: i, q, userAns, isCorrect: false, status: 'no respondida' });
        } else if (isCorrect) {
            correctCount++;
            detall.push({ index: i, q, userAns, isCorrect: true, status: 'correcta' });
        } else {
            wrongCount++;
            detall.push({ index: i, q, userAns, isCorrect: false, status: 'fallada' });
        }
    }

    const percent = Math.round((correctCount / total) * 100);
    finalScore.textContent = correctCount;
    let msg = '';
    if (correctCount === total) msg = '🏆 Perfecte! Ets un expert en trampes!';
    else if (correctCount >= total * 0.8) msg = '🌟 Molt bé! Ja saps les trampes.';
    else if (correctCount >= total * 0.6) msg = '👍 Bé, però repassa les que has fallat.';
    else if (correctCount >= total * 0.4) msg = '📚 Necessites estudiar més les trampes.';
    else msg = '💪 Torna a intentar-ho, aquest test és ple de trampes.';
    finalMessage.textContent = msg;

    let html = `<div style="font-weight:600; margin-bottom:8px;">📋 Detall de respostes</div>`;
    detall.forEach((item, idx) => {
        const q = item.q;
        const userLletra = item.userAns !== null ? String.fromCharCode(65 + item.userAns) : '—';
        const correctLletra = String.fromCharCode(65 + q.correcta);
        let icon = '', color = '';
        if (item.status === 'correcta') { icon = '✅'; color = '#1e7e34'; }
        else if (item.status === 'fallada') { icon = '❌'; color = '#b91c1c'; }
        else { icon = '⏭️'; color = '#64748b'; }
        html += `
            <div class="result-item">
                <span style="color:${color}; font-weight:600;">${icon} ${idx+1}.</span>
                <strong>${q.pregunta}</strong>
                <br><span style="font-size:13px;">Tria: ${userLletra} | Correcta: ${correctLletra}</span>
                <br><span class="justif">💡 ${q.justificacio}</span>
                ${q.mnemo ? `<br><span class="mnemo">🧠 ${q.mnemo}</span>` : ''}
            </div>
        `;
    });
    resultDetail.innerHTML = html;

    questionArea.classList.add('hidden');
    resultArea.classList.remove('hidden');

    const fallades = detall.filter(d => d.status === 'fallada').map(d => d.index);
    if (fallades.length > 0) {
        retryWrongBtn.style.display = 'inline-block';
        retryWrongBtn.onclick = () => startRetry(fallades);
    } else {
        retryWrongBtn.style.display = 'none';
    }
}

function startRetry(falladesIndices) {
    if (falladesIndices.length === 0) return;
    for (let idx of falladesIndices) {
        answers[idx] = null;
        revealed[idx] = false;
    }
    mode = 'retry';
    wrongIndices = falladesIndices;
    currentIndex = 0;
    resultArea.classList.add('hidden');
    questionArea.classList.remove('hidden');
    renderQuestion(0);
    window.scrollTo({ top: 0, behavior: 'auto' });
}

function resetTest() {
    mode = 'normal';
    wrongIndices = [];
    currentIndex = 0;
    answers = new Array(PREGUNTES.length).fill(null);
    revealed = new Array(PREGUNTES.length).fill(false);
    resultArea.classList.add('hidden');
    questionArea.classList.remove('hidden');
    renderQuestion(0);
    window.scrollTo({ top: 0, behavior: 'auto' });
}

checkBtn.addEventListener('click', checkAnswer);
checkBtn.addEventListener('touchstart', (e) => { if (!e.target.disabled) checkAnswer(); }, { passive: true });
prevBtn.addEventListener('click', () => goTo(currentIndex - 1));
prevBtn.addEventListener('touchstart', (e) => { if (!e.target.disabled) goTo(currentIndex - 1); }, { passive: true });
resetBtn.addEventListener('click', resetTest);
resetBtn.addEventListener('touchstart', resetTest, { passive: true });

renderQuestion(0);
</script>
</body>
</html>
