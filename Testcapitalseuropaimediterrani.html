<!DOCTYPE html>
<html lang="ca">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        @media (max-width: 480px) { .container { padding: 18px 14px 22px; } .question-text { font-size: 18px; } .option { font-size: 15px; padding: 14px 16px; } .btn { font-size: 15px; padding: 12px 10px; min-width: 80px; } .header h1 { font-size: 19px; } }

<body>
<div class="container" id="app">

</div>
<script>
const PREGUNTES = [
{id:1, pregunta:"Quina és la capital d'Àustria?", opcions:["Salzburg","Viena","Bratislava"], correcta:1, justificacio:"Viena és la capital d'Àustria.", mnemo:"Viena → Àustria, com 'V'."},

{id:4, pregunta:"Quina és la capital de Bulgària?", opcions:["Sofia","Skopje","Tirana"], correcta:0, justificacio:"Sofia és la capital de Bulgària.", mnemo:"Sofia → Bulgària, com 'S'."},

{id:7, pregunta:"Quina és la capital d'Eslovàquia?", opcions:["Bratislava","Ljubljana","Praga"], correcta:0, justificacio:"Bratislava és la capital d'Eslovàquia.", mnemo:"Bratislava → Eslovàquia, com 'B'."},
{id:8, pregunta:"Quina és la capital de Sèrbia?", opcions:["Sarajevo","Belgrad","Podgorica"], correcta:1, justificacio:"Belgrad és la capital de Sèrbia.", mnemo:"Belgrad → Sèrbia, com 'B'."},

{id:10, pregunta:"Quina és la capital de Montenegro?", opcions:["Podgorica","Tirana","Skopje"], correcta:0, justificacio:"Podgorica és la capital de Montenegro.", mnemo:"Podgorica → Montenegro, com 'P'."},

{id:13, pregunta:"Quina és la capital de Kosovo?", opcions:["Sarajevo","Pristina","Tirana"], correcta:1, justificacio:"Pristina és la capital de Kosovo.", mnemo:"Pristina → Kosovo, com 'P'."},
{id:14, pregunta:"Quina és la capital de Moldàvia?", opcions:["Minsk","Chisinau","Kiev"], correcta:1, justificacio:"Chisinau és la capital de Moldàvia.", mnemo:"Chisinau → Moldàvia, com 'C'."},

{id:16, pregunta:"Quina és la capital de Grècia?", opcions:["Atenes","Tessalònica","Corint"], correcta:0, justificacio:"Atenes és la capital de Grècia.", mnemo:"Atenes → Grècia, com 'A'."},
{id:17, pregunta:"Quina és la capital de Turquia?", opcions:["Istanbul","Ankara","Esmirna"], correcta:1, justificacio:"Istanbul és la ciutat més gran, però la capital és Ankara.", mnemo:"Ankara → capital de Turquia, com 'A'."},
{id:18, pregunta:"Quina és la capital de Xipre?", opcions:["Limassol","Nicòsia","Larnaca"], correcta:1, justificacio:"Nicòsia és la capital de Xipre.", mnemo:"Nicòsia → Xipre, com 'N'."},
{id:19, pregunta:"Quina és la capital de Malta?", opcions:["Valletta","Mdina","Sliema"], correcta:0, justificacio:"Valletta és la capital de Malta.", mnemo:"Valletta → Malta, com 'V'."},
{id:20, pregunta:"Quina és la capital d'Egipte?", opcions:["Alexandria","El Caire","Gizeh"], correcta:1, justificacio:"El Caire és la capital d'Egipte.", mnemo:"Caire → Egipte, com 'C'."},
{id:21, pregunta:"Quina és la capital de Líbia?", opcions:["Trípoli","Bengasi","Tunis"], correcta:0, justificacio:"Trípoli és la capital de Líbia.", mnemo:"Trípoli → Líbia, com 'T'."},
{id:22, pregunta:"Quina és la capital de Tunísia?", opcions:["Alger","Tunis","Casablanca"], correcta:1, justificacio:"Tunis és la capital de Tunísia.", mnemo:"Tunis → Tunísia, com 'T'."},
{id:23, pregunta:"Quina és la capital d'Algèria?", opcions:["Orà","Alger","Tunis"], correcta:1, justificacio:"Alger és la capital d'Algèria.", mnemo:"Alger → Algèria, com 'A'."},
{id:24, pregunta:"Quina és la capital del Marroc?", opcions:["Casablanca","Marràqueix","Rabat"], correcta:2, justificacio:"Rabat és la capital del Marroc; Casablanca és la ciutat més gran.", mnemo:"Rabat → Marroc, com 'R'."},

{id:27, pregunta:"Quina és la capital de Jordània?", opcions:["Amman","Jerusalem","Beirut"], correcta:0, justificacio:"Amman és la capital de Jordània.", mnemo:"Amman → Jordània, com 'A'."},
{id:28, pregunta:"Quin d'aquests països NO té costa al mar Mediterrani?", opcions:["Portugal","Espanya","Itàlia"], correcta:0, justificacio:"Portugal té costa atlàntica, però no mediterrània.", mnemo:"Portugal → no Mediterrani, com 'P'."},
{id:29, pregunta:"Quina d'aquestes ciutats NO és la capital del país que s'indica?", opcions:["Istanbul — Turquia","Atenes — Grècia","Rabat — Marroc"], correcta:0, justificacio:"Istanbul no és la capital de Turquia; la capital és Ankara.", mnemo:"Istanbul → no capital, com 'I'."},
{id:30, pregunta:"Quina de les següents capitals està situada en una illa del mar Mediterrani?", opcions:["Valletta","Atenes","Roma"], correcta:0, justificacio:"Valletta és la capital de Malta, estat insular al Mediterrani.", mnemo:"Valletta → illa, com 'V'."}
];
// Lògica del test (idèntica a l'anterior)
let answers=new Array(PREGUNTES.length).fill(null), revealed=new Array(PREGUNTES.length).fill(false), currentIndex=0, mode='normal', wrongIndices=[];
const $=id=>document.getElementById(id), questionArea=$('questionArea'), resultArea=$('resultArea'), progressLabel=$('progressLabel'), qNumber=$('qNumber'), questionStatus=$('questionStatus'), qText=$('qText'), optionsContainer=$('optionsContainer'), feedback=$('feedback'), badgeResult=$('badgeResult'), justificationText=$('justificationText'), mnemonicText=$('mnemonicText'), checkBtn=$('checkBtn'), nextBtn=$('nextBtn'), prevBtn=$('prevBtn'), resetBtn=$('resetBtn'), retryWrongBtn=$('retryWrongBtn'), finalScore=$('finalScore'), finalMessage=$('finalMessage'), resultDetail=$('resultDetail');
function getCurrentQuestions(){if(mode==='retry'&&wrongIndices.length>0)return wrongIndices.map(i=>PREGUNTES[i]);return PREGUNTES;}
function getCurrentAnswers(){if(mode==='retry'&&wrongIndices.length>0)return wrongIndices.map(i=>answers[i]);return answers;}
function getCurrentRevealed(){if(mode==='retry'&&wrongIndices.length>0)return wrongIndices.map(i=>revealed[i]);return revealed;}
function renderQuestion(index){const qs=getCurrentQuestions(), ans=getCurrentAnswers(), rev=getCurrentRevealed();if(index>=qs.length){showResults();return;}const q=qs[index], userAnswer=ans[index], isRevealed=rev[index], total=qs.length;progressLabel.textContent=index+1+' / '+total;qNumber.innerHTML='<span>Pregunta '+(index+1)+'</span><span id="questionStatus"></span>';if(isRevealed){const isCorrect=userAnswer===q.correcta;document.getElementById('questionStatus').textContent=isCorrect?'✅':'❌';}else{document.getElementById('questionStatus').textContent='';}qText.textContent=q.pregunta;optionsContainer.innerHTML='';const letters=['a','b','c'];q.opcions.forEach((text,i)=>{const div=document.createElement('div');div.className='option';if(userAnswer===i)div.classList.add('selected');if(isRevealed){div.classList.add('disabled');if(i===q.correcta)div.classList.add('correct');if(userAnswer===i&&i!==q.correcta)div.classList.add('wrong');}div.innerHTML='<span class="letter">'+letters[i]+'</span> '+text;div.dataset.index=i;if(!isRevealed){const handler=()=>selectOption(index,i);div.addEventListener('click',handler);div.addEventListener('touchstart',(e)=>{if(!e.target.closest('.option.disabled'))handler();},{passive:true});}optionsContainer.appendChild(div);});if(isRevealed){const isCorrect=userAnswer===q.correcta;badgeResult.textContent=isCorrect?'✅ Correcte':'❌ Incorrecte';badgeResult.className='badge '+(isCorrect?'correct-badge':'wrong-badge');justificationText.textContent=q.justificacio;mnemonicText.innerHTML='<strong>🧠 Truc:</strong> '+q.mnemo;feedback.classList.add('show');checkBtn.style.display='none';nextBtn.style.display='inline-block';}else{feedback.classList.remove('show');checkBtn.style.display='inline-block';nextBtn.style.display='none';}nextBtn.disabled=(index===total-1&&!isRevealed);prevBtn.disabled=(index===0);if(index===total-1&&isRevealed){nextBtn.textContent='📊 Resultat';nextBtn.onclick=showResults;}else{nextBtn.textContent='Següent →';nextBtn.onclick=()=>goTo(index+1);}}
function selectOption(qIndex,optIndex){if(getCurrentRevealed()[qIndex])return;const ans=getCurrentAnswers();ans[qIndex]=optIndex;if(mode==='retry'&&wrongIndices.length>0){const originalIdx=wrongIndices[qIndex];answers[originalIdx]=optIndex;}renderQuestion(currentIndex);}
function checkAnswer(){const qs=getCurrentQuestions(), ans=getCurrentAnswers(), rev=getCurrentRevealed(), idx=currentIndex;if(ans[idx]===null){alert('Selecciona una opció abans de comprovar.');return;}rev[idx]=true;if(mode==='retry'&&wrongIndices.length>0){const originalIdx=wrongIndices[idx];revealed[originalIdx]=true;}renderQuestion(currentIndex);}
function goTo(index){const qs=getCurrentQuestions();if(index<0||index>=qs.length)return;currentIndex=index;renderQuestion(index);window.scrollTo({top:0,behavior:'auto'});}
function showResults(){const total=PREGUNTES.length;let correctCount=0,wrongCount=0,unanswered=0,detall=[];for(let i=0;i<total;i++){const q=PREGUNTES[i], userAns=answers[i], isRevealed=revealed[i], isCorrect=userAns===q.correcta;if(!isRevealed){unanswered++;detall.push({index:i,q,userAns,isCorrect:false,status:'no respondida'});}else if(isCorrect){correctCount++;detall.push({index:i,q,userAns,isCorrect:true,status:'correcta'});}else{wrongCount++;detall.push({index:i,q,userAns,isCorrect:false,status:'fallada'});}}const percent=Math.round((correctCount/total)*100);finalScore.textContent=correctCount;let msg='';if(correctCount===total)msg='🏆 Perfecte! Saps totes les capitals!';else if(correctCount>=total*0.8)msg='🌟 Molt bé!';else if(correctCount>=total*0.6)msg='👍 Bé, repassa les fallades.';else if(correctCount>=total*0.4)msg='📚 Necessites estudiar més.';else msg='💪 Torna a intentar-ho.';finalMessage.textContent=msg;let html='<div style="font-weight:600;margin-bottom:8px;">📋 Detall</div>';detall.forEach((item,idx)=>{const q=item.q,userLletra=item.userAns!==null?String.fromCharCode(65+item.userAns):'—',correctLletra=String.fromCharCode(65+q.correcta);let icon='',color='';if(item.status==='correcta'){icon='✅';color='#1e7e34';}else if(item.status==='fallada'){icon='❌';color='#b91c1c';}else{icon='⏭️';color='#64748b';}html+='<div class="result-item"><span style="color:'+color+';font-weight:600;">'+icon+' '+(idx+1)+'.</span> <strong>'+q.pregunta+'</strong><br><span style="font-size:13px;">Tria: '+userLletra+' | Correcta: '+correctLletra+'</span><br><span class="justif">💡 '+q.justificacio+'</span>'+(q.mnemo?'<br><span class="mnemo">🧠 '+q.mnemo+'</span>':'')+'</div>';});resultDetail.innerHTML=html;questionArea.classList.add('hidden');resultArea.classList.remove('hidden');const fallades=detall.filter(d=>d.status==='fallada').map(d=>d.index);if(fallades.length>0){retryWrongBtn.style.display='inline-block';retryWrongBtn.onclick=()=>startRetry(fallades);}else{retryWrongBtn.style.display='none';}}
function startRetry(falladesIndices){if(falladesIndices.length===0)return;for(let idx of falladesIndices){answers[idx]=null;revealed[idx]=false;}mode='retry';wrongIndices=falladesIndices;currentIndex=0;resultArea.classList.add('hidden');questionArea.classList.remove('hidden');renderQuestion(0);window.scrollTo({top:0,behavior:'auto'});}
function resetTest(){mode='normal';wrongIndices=[];currentIndex=0;answers=new Array(PREGUNTES.length).fill(null);revealed=new Array(PREGUNTES.length).fill(false);resultArea.classList.add('hidden');questionArea.classList.remove('hidden');renderQuestion(0);window.scrollTo({top:0,behavior:'auto'});}
checkBtn.addEventListener('click',checkAnswer);checkBtn.addEventListener('touchstart',(e)=>{if(!e.target.disabled)checkAnswer();},{passive:true});prevBtn.addEventListener('click',()=>goTo(currentIndex-1));prevBtn.addEventListener('touchstart',(e)=>{if(!e.target.disabled)goTo(currentIndex-1);},{passive:true});resetBtn.addEventListener('click',resetTest);resetBtn.addEventListener('touchstart',resetTest,{passive:true});renderQuestion(0);
</script>
</body>
